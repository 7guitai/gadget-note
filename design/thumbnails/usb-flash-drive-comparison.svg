<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：USBメモリの比較（両端子型、ノック式、スライド式の一般的な形） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 比較</text>
  <text class="h1" x="68" y="256">USBメモリを</text>
  <text class="h1" x="68" y="332">比較</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">USB-A・USB-C両対応、</text>
  <text class="sub" x="72" y="480">ノック式、スライド式</text>

  <!-- 両端子型 -->
  <g transform="translate(760 150)">
    <rect x="0" y="10" width="34" height="40" rx="4" fill="#C9D8B4" stroke="#7C9A5E" stroke-width="3"/>
    <rect x="30" y="0" width="220" height="60" rx="14" fill="#173D38"/>
    <rect x="246" y="18" width="30" height="24" rx="10" fill="#C9D8B4" stroke="#7C9A5E" stroke-width="3"/>
  </g>
  <text class="tag" x="900" y="240">A＋C</text>
  <!-- ノック式 -->
  <g transform="translate(760 290)">
    <rect x="0" y="0" width="230" height="56" rx="28" fill="#7C9A5E"/>
    <rect x="226" y="16" width="30" height="24" rx="6" fill="#5E7B49"/>
    <rect x="-24" y="10" width="28" height="36" rx="4" fill="#C9D8B4" stroke="#7C9A5E" stroke-width="3"/>
  </g>
  <text class="tag" x="880" y="374">ノック式</text>
  <!-- スライド式 -->
  <g transform="translate(760 420)">
    <rect x="30" y="0" width="210" height="56" rx="10" fill="#5E7B49"/>
    <rect x="110" y="-8" width="40" height="12" rx="6" fill="#E8B04B"/>
    <rect x="0" y="10" width="34" height="36" rx="4" fill="#C9D8B4" stroke="#7C9A5E" stroke-width="3"/>
  </g>
  <text class="tag" x="895" y="504">スライド式</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
