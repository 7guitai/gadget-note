<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Claude Codeとは（ターミナルからファイルを編集するAIのイメージ） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 72px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; letter-spacing: .02em; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .mono { font-family: monospace; font-size: 22px; font-weight: 700; fill: #C9D8B4; }
      .card { fill: #FFFFFF; stroke: #D8DDD3; stroke-width: 2; }
      .line { stroke: #D8DDD3; stroke-width: 6; stroke-linecap: round; }
      .tline { stroke: #5E7B49; stroke-width: 6; stroke-linecap: round; }
      .link { fill: none; stroke: #9DB383; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="330" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ ツールの基本を解説</text>
  <text class="h1" x="68" y="268">Claude Code</text>
  <text class="h1" x="68" y="356">とは？</text>
  <rect x="72" y="398" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="458">ファイルを読んで直す</text>
  <text class="sub" x="72" y="500">AIのコーディングツール</text>

  <!-- つなぐ線 -->
  <path class="link" d="M960 290 C 1010 250, 1040 220, 1060 190"/>
  <path class="link" d="M960 360 C 1010 400, 1040 430, 1060 450"/>

  <!-- ターミナルの画面 -->
  <g transform="translate(690 210)">
    <rect width="290" height="200" rx="20" fill="#173D38"/>
    <circle cx="26" cy="24" r="7" fill="#5E7B49"/>
    <circle cx="48" cy="24" r="7" fill="#5E7B49"/>
    <circle cx="70" cy="24" r="7" fill="#5E7B49"/>
    <text class="mono" x="24" y="82">&gt;</text>
    <line class="tline" x1="52" y1="75" x2="200" y2="75"/>
    <line class="tline" x1="52" y1="110" x2="240" y2="110"/>
    <line class="tline" x1="52" y1="145" x2="160" y2="145"/>
    <rect x="52" y="166" width="14" height="22" fill="#C9D8B4"/>
  </g>

  <!-- ファイル（編集中） -->
  <g transform="translate(1010 92) rotate(4)">
    <path class="card" d="M0 18 a18 18 0 0 1 18 -18 h80 l30 30 v100 a18 18 0 0 1 -18 18 h-92 a18 18 0 0 1 -18 -18z"/>
    <line class="line" x1="20" y1="54" x2="100" y2="54"/>
    <rect x="16" y="70" width="96" height="16" rx="6" fill="#C9D8B4"/>
    <line class="line" x1="20" y1="104" x2="88" y2="104"/>
  </g>
  <text class="tag" x="1030" y="276">編集する</text>

  <!-- チェック（テストを確かめる） -->
  <g transform="translate(1000 440) rotate(-3)">
    <rect class="card" width="140" height="100" rx="18"/>
    <circle cx="44" cy="50" r="22" fill="#7C9A5E"/>
    <path d="M33 50 l8 8 l14 -16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="line" x1="80" y1="40" x2="118" y2="40"/>
    <line class="line" x1="80" y1="60" x2="108" y2="60"/>
  </g>
  <text class="tag" x="1030" y="572">確かめる</text>

  <!-- きらめき -->
  <path d="M700 172 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6z" fill="#C9D8B4"/>

  <text class="cap" x="760" y="604">※ イメージ。実際の画面やロゴではありません</text>
</svg>
