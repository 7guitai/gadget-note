<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：ワークチェアを選ぶ前に（高さ調整できる椅子、座面高の目盛り） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .tick { font-size: 18px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">家具 ／ 選び方</text>
  <text class="h1" x="68" y="258">ワークチェアを</text>
  <text class="h1" x="68" y="336">選ぶ前に</text>
  <rect x="72" y="382" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="442">座面の高さ・背もたれ・</text>
  <text class="sub" x="72" y="484">肘掛けの確認ポイント</text>

  <!-- 椅子（一般的な形） -->
  <g fill="#173D38">
    <rect x="800" y="120" width="150" height="190" rx="36" fill="#5E7B49"/>
    <rect x="860" y="300" width="30" height="40" fill="#5E7B49"/>
    <rect x="770" y="330" width="210" height="40" rx="18"/>
    <rect x="752" y="268" width="20" height="70" rx="8" fill="#7C9A5E"/>
    <rect x="978" y="268" width="20" height="70" rx="8" fill="#7C9A5E"/>
    <rect x="745" y="262" width="60" height="16" rx="8" fill="#7C9A5E"/>
    <rect x="945" y="262" width="60" height="16" rx="8" fill="#7C9A5E"/>
    <rect x="864" y="370" width="22" height="80" rx="6"/>
    <path d="M875 448 L790 478 M875 448 L960 478 M875 448 L875 488" stroke="#173D38" stroke-width="12" stroke-linecap="round"/>
    <circle cx="790" cy="488" r="12"/>
    <circle cx="960" cy="488" r="12"/>
    <circle cx="875" cy="498" r="12"/>
  </g>
  <!-- 高さ調整の矢印 -->
  <path d="M908 392 v40 M900 400 l8 -10 l8 10 M900 424 l8 10 l8 -10" stroke="#5E7B49" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 座面高の目盛り -->
  <g stroke="#173D38" stroke-width="4" stroke-linecap="round">
    <line x1="1060" y1="340" x2="1060" y2="510"/>
    <line x1="1048" y1="510" x2="1072" y2="510"/>
    <line x1="1050" y1="350" x2="1070" y2="350"/>
    <line x1="1050" y1="380" x2="1070" y2="380"/>
  </g>
  <line x1="990" y1="350" x2="1040" y2="350" stroke="#9DB383" stroke-width="3" stroke-dasharray="6 6"/>
  <text class="tick" x="1080" y="356">43cm</text>
  <text class="tick" x="1080" y="386">37cm</text>
  <text class="tag" x="1075" y="545">座面の高さ</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
