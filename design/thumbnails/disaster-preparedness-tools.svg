<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：防災用の道具（懐中電灯、携帯ラジオ、乾電池、リュック） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">道具 ／ 防災の備え</text>
  <text class="h1" x="68" y="258">防災用に備えたい</text>
  <text class="h1" x="68" y="336">道具</text>
  <rect x="72" y="382" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="442">ライト・ラジオ・電源と</text>
  <text class="sub" x="72" y="484">置き場所・点検</text>

  <!-- リュック -->
  <g transform="translate(700 150)">
    <path d="M40 30 a50 50 0 0 1 100 0" fill="none" stroke="#173D38" stroke-width="12"/>
    <rect x="0" y="30" width="180" height="230" rx="40" fill="#5E7B49"/>
    <rect x="30" y="150" width="120" height="80" rx="18" fill="#7C9A5E"/>
    <rect x="60" y="140" width="60" height="12" rx="6" fill="#173D38"/>
  </g>
  <text class="tag" x="790" y="450">持ち出し袋</text>

  <!-- 懐中電灯 -->
  <g transform="translate(925 170)">
    <path d="M0 0 h70 l-12 40 h-46z" fill="#173D38"/>
    <rect x="16" y="40" width="38" height="110" rx="10" fill="#173D38"/>
    <path d="M10 -6 L-30 -70 h130 L60 -6z" fill="#F3E3B0" opacity=".8"/>
  </g>
  <text class="tag" x="960" y="350">明かり</text>

  <!-- 携帯ラジオ -->
  <g transform="translate(1020 220)">
    <line x1="90" y1="0" x2="120" y2="-60" stroke="#173D38" stroke-width="6" stroke-linecap="round"/>
    <rect x="0" y="0" width="130" height="90" rx="14" fill="#173D38"/>
    <circle cx="40" cy="45" r="24" fill="#9DB383"/>
    <rect x="80" y="25" width="34" height="10" rx="5" fill="#C9B593"/>
    <rect x="80" y="50" width="34" height="10" rx="5" fill="#C9B593"/>
  </g>
  <text class="tag" x="1085" y="350">情報</text>

  <!-- 乾電池 -->
  <g transform="translate(940 400)">
    <rect x="0" y="0" width="34" height="90" rx="6" fill="#5E7B49"/>
    <rect x="10" y="-8" width="14" height="10" rx="2" fill="#173D38"/>
    <rect x="50" y="0" width="34" height="90" rx="6" fill="#5E7B49"/>
    <rect x="60" y="-8" width="14" height="10" rx="2" fill="#173D38"/>
  </g>
  <!-- モバイルバッテリー -->
  <g transform="translate(1050 390)">
    <rect width="70" height="110" rx="12" fill="#173D38"/>
    <rect x="18" y="40" width="34" height="18" rx="4" fill="#9DB383"/>
  </g>
  <text class="tag" x="1030" y="540">電源</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
