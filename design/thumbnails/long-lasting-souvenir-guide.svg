<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：日持ちするお土産の選び方（お菓子の箱と期限ラベル、個包装） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 68px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .lbl { font-size: 20px; font-weight: 800; fill: #173D38; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">お土産 ／ 選び方</text>
  <text class="h1" x="68" y="264">日持ちする</text>
  <text class="h1" x="68" y="350">お土産の選び方</text>
  <rect x="72" y="394" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="454">賞味期限・個包装</text>
  <text class="sub" x="72" y="496">持ち運びで選ぶ</text>

  <!-- お菓子の箱（一般的な形） -->
  <g transform="translate(720 230)">
    <rect x="0" y="40" width="300" height="180" rx="16" fill="#7C9A5E"/>
    <rect x="-10" y="20" width="320" height="50" rx="14" fill="#5E7B49"/>
    <rect x="140" y="20" width="40" height="200" fill="#C9D8B4"/>
    <path d="M160 20 C 120 -30, 90 -10, 130 18 Z" fill="#C9D8B4"/>
    <path d="M160 20 C 200 -30, 230 -10, 190 18 Z" fill="#C9D8B4"/>
  </g>

  <!-- 期限ラベル -->
  <g transform="translate(980 150) rotate(6)">
    <rect width="170" height="90" rx="14" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="2"/>
    <text class="lbl" x="18" y="38">賞味期限</text>
    <rect x="18" y="54" width="120" height="12" rx="6" fill="#D8DDD3"/>
  </g>

  <!-- 個包装のお菓子 -->
  <g transform="translate(1040 470)">
    <path d="M0 20 l14 -10 v40 l-14 -10z" fill="#9DB383"/>
    <rect x="14" y="8" width="70" height="44" rx="10" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="2"/>
    <path d="M98 20 l-14 -10 v40 l14 -10z" fill="#9DB383"/>
    <circle cx="49" cy="30" r="10" fill="#E9C9B8"/>
  </g>

  <text class="cap" x="760" y="604">※ イメージ。実際の商品の形ではありません</text>
</svg>
