<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：職場に配るお土産（個包装のお菓子の箱、原材料の表示ラベル） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .lbl { font-size: 15px; font-weight: 800; fill: #173D38; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">お土産 ／ 選び方</text>
  <text class="h1" x="68" y="258">職場に配る</text>
  <text class="h1" x="68" y="336">お土産の選び方</text>
  <rect x="72" y="382" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="442">個包装・アレルギー表示・</text>
  <text class="sub" x="72" y="484">日持ちの確認</text>

  <!-- お菓子の箱（ふたを開けた状態） -->
  <g transform="translate(690 230)">
    <rect width="300" height="200" rx="14" fill="#5E7B49"/>
    <rect x="16" y="16" width="268" height="168" rx="8" fill="#F6F2EA"/>
    <g fill="#C9D8B4" stroke="#7C9A5E" stroke-width="3">
      <rect x="32" y="32" width="70" height="60" rx="10"/>
      <rect x="115" y="32" width="70" height="60" rx="10"/>
      <rect x="198" y="32" width="70" height="60" rx="10"/>
      <rect x="32" y="108" width="70" height="60" rx="10"/>
      <rect x="115" y="108" width="70" height="60" rx="10"/>
      <rect x="198" y="108" width="70" height="60" rx="10"/>
    </g>
  </g>
  <!-- ふた -->
  <rect x="690" y="150" width="300" height="60" rx="14" fill="#173D38"/>
  <text class="tag" x="840" y="470">個包装</text>

  <!-- 原材料の表示ラベル -->
  <g transform="translate(1010 200)">
    <rect width="140" height="190" rx="10" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <text class="lbl" x="16" y="34">原材料名</text>
    <rect x="16" y="50" width="108" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="16" y="70" width="90" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="16" y="90" width="100" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="16" y="116" width="108" height="26" rx="6" fill="#F3E3B0"/>
    <rect x="16" y="156" width="80" height="10" rx="5" fill="#D8DDD3"/>
  </g>
  <text class="tag" x="1080" y="430">外箱の表示</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の商品や表示ではありません</text>
</svg>
