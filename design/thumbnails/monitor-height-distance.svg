<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：モニターの高さと距離（座った人、モニター、目の高さと距離の線） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">家具 ／ 使い方</text>
  <text class="h1" x="68" y="256">モニターの</text>
  <text class="h1" x="68" y="332">高さと距離</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">上端は目の高さまで・</text>
  <text class="sub" x="72" y="480">40cm以上離す</text>

  <!-- 机 -->
  <rect x="890" y="380" width="250" height="14" rx="4" fill="#5E7B49"/>
  <rect x="1110" y="394" width="12" height="130" fill="#5E7B49"/>
  <!-- モニター -->
  <rect x="1040" y="200" width="20" height="130" rx="4" fill="#173D38"/>
  <rect x="1046" y="330" width="8" height="40" fill="#173D38"/>
  <rect x="1020" y="370" width="60" height="10" rx="3" fill="#173D38"/>
  <!-- 椅子 -->
  <rect x="720" y="400" width="130" height="16" rx="6" fill="#7C9A5E"/>
  <rect x="712" y="260" width="16" height="150" rx="6" fill="#7C9A5E"/>
  <rect x="780" y="416" width="10" height="80" fill="#7C9A5E"/>
  <rect x="740" y="496" width="90" height="8" rx="4" fill="#7C9A5E"/>
  <!-- 人 -->
  <circle cx="790" cy="200" r="34" fill="#173D38"/>
  <path d="M760 240 h50 l10 160 h-70z" fill="#2E5149"/>
  <path d="M810 270 l80 40 l60 70" stroke="#2E5149" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M800 400 h70 v90" stroke="#2E5149" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 目の高さの線と距離 -->
  <line x1="815" y1="198" x2="1040" y2="198" stroke="#E8B04B" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="815" y1="150" x2="1040" y2="150" stroke="#9DB383" stroke-width="4"/>
  <path d="M815 140 v20 M1040 140 v20" stroke="#9DB383" stroke-width="4"/>
  <text class="tag" x="928" y="136">40cm以上</text>
  <text class="tag" x="1110" y="204">上端</text>

  <text class="cap" x="640" y="604">※ イメージ。距離や大きさは正確ではありません</text>
</svg>
