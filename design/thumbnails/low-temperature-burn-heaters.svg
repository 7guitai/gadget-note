<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：低温やけど（布団と足元の電気あんか、カイロ、温度計）。人物は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .deg { font-size: 22px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 解説</text>
  <text class="h1" x="68" y="252">低温やけどを</text>
  <text class="h1" x="68" y="326">防ぐには？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">電気あんか・カイロ・電気マット</text>

  <!-- 布団 -->
  <rect x="700" y="300" width="400" height="120" rx="30" fill="#C9D8B4"/>
  <path d="M700 330 Q900 280 1100 330" fill="none" stroke="#9DB383" stroke-width="6"/>
  <rect x="720" y="250" width="110" height="60" rx="20" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
  <!-- 電気あんか -->
  <g transform="translate(1000 330)">
    <ellipse rx="54" ry="34" fill="#7C9A5E" stroke="#173D38" stroke-width="5"/>
    <path d="M-20 -6 Q-10 -18 0 -6 Q10 6 20 -6" fill="none" stroke="#E8B04B" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- カイロ -->
  <g transform="translate(760 120)">
    <rect width="90" height="100" rx="12" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <path d="M24 40 Q34 26 44 40 Q54 54 64 40" fill="none" stroke="#E8B04B" stroke-width="5" stroke-linecap="round"/>
    <rect x="22" y="70" width="46" height="10" rx="5" fill="#C9D8B4"/>
  </g>
  <!-- 温度計 -->
  <g transform="translate(940 130)">
    <rect x="-12" y="0" width="24" height="110" rx="12" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect x="-5" y="50" width="10" height="60" rx="5" fill="#E8B04B"/>
    <circle cx="0" cy="126" r="20" fill="#E8B04B" stroke="#173D38" stroke-width="5"/>
    <text class="deg" x="30" y="40">44℃</text>
  </g>
  <text class="tag" x="900" y="470" text-anchor="middle">寝るときは使い方に注意</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
