<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：生成AIの画像はブログに使える？（画像カードと確認のチェックリスト） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 68px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .item { font-size: 21px; font-weight: 700; fill: #173D38; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .card { fill: #FFFFFF; stroke: #D8DDD3; stroke-width: 2; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 使う前の確認</text>
  <text class="h1" x="68" y="264">生成AIの画像は</text>
  <text class="h1" x="68" y="350">ブログに使える？</text>
  <rect x="72" y="394" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="454">利用規約と著作権</text>
  <text class="sub" x="72" y="496">3つの確認ポイント</text>

  <!-- 画像カード（山と太陽の一般的なアイコン） -->
  <g transform="translate(700 110) rotate(-4)">
    <rect class="card" width="230" height="170" rx="18"/>
    <rect x="18" y="18" width="194" height="134" rx="10" fill="#E6EBE1"/>
    <circle cx="160" cy="54" r="16" fill="#C9D8B4"/>
    <path d="M30 140 L 90 70 L 130 115 L 155 90 L 200 140 Z" fill="#7C9A5E"/>
    <path d="M196 22 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5z" fill="#9DB383"/>
  </g>

  <!-- チェックリスト -->
  <g transform="translate(800 320)">
    <rect class="card" width="320" height="200" rx="18"/>
    <rect x="24" y="30" width="28" height="28" rx="8" fill="#7C9A5E"/>
    <path d="M31 44 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="item" x="68" y="52">利用規約</text>
    <rect x="24" y="86" width="28" height="28" rx="8" fill="#7C9A5E"/>
    <path d="M31 100 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="item" x="68" y="108">似ていないか</text>
    <rect x="24" y="142" width="28" height="28" rx="8" fill="#FFFFFF" stroke="#9DB383" stroke-width="3"/>
    <text class="item" x="68" y="164">誤解させないか</text>
  </g>

  <text class="cap" x="760" y="604">※ イメージ。実際の画面やロゴではありません</text>
</svg>
