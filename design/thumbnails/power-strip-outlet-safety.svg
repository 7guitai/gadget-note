<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：コンセントまわりの火災予防（壁のコンセント、テーブルタップ、ほこり、注意マーク） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">くらし ／ 解説</text>
  <text class="h1" x="68" y="252">延長コード・</text>
  <text class="h1" x="68" y="326">コンセントの火災</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">1500Wの目安と</text>
  <text class="sub" x="72" y="478">5つの点検ポイント</text>

  <!-- 壁のコンセント -->
  <g transform="translate(740 130)">
    <rect width="150" height="200" rx="16" fill="#FFFFFF" stroke="#C9D8B4" stroke-width="4"/>
    <g fill="#173D38">
      <rect x="55" y="40" width="10" height="28" rx="3"/><rect x="85" y="40" width="10" height="28" rx="3"/>
      <rect x="55" y="120" width="10" height="28" rx="3"/><rect x="85" y="120" width="10" height="28" rx="3"/>
    </g>
  </g>
  <text class="tag" x="815" y="362">2口で1500W</text>
  <!-- ほこり -->
  <g fill="#B8B2A4"><circle cx="905" cy="300" r="6"/><circle cx="918" cy="290" r="4"/><circle cx="912" cy="312" r="3"/></g>
  <!-- テーブルタップ -->
  <g transform="translate(760 420)">
    <rect width="300" height="70" rx="16" fill="#5E7B49"/>
    <g fill="#F6F2EA"><rect x="30" y="20" width="44" height="30" rx="6"/><rect x="100" y="20" width="44" height="30" rx="6"/><rect x="170" y="20" width="44" height="30" rx="6"/></g>
    <rect x="236" y="22" width="40" height="26" rx="6" fill="#E8B04B"/>
  </g>
  <path d="M1060 455 C 1110 455, 1120 400, 1110 330" stroke="#5E7B49" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- 注意 -->
  <circle cx="1040" cy="200" r="34" fill="#FFFFFF" stroke="#C25B4A" stroke-width="7"/>
  <rect x="1036" y="180" width="8" height="26" rx="4" fill="#C25B4A"/>
  <circle cx="1040" cy="218" r="5" fill="#C25B4A"/>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
