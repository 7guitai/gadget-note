<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：モバイルバッテリーの機内持ち込み（バッテリー2個、飛行機、160Wh、充電禁止） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 20px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
      .lbl { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 解説</text>
  <text class="h1" x="68" y="252">モバイルバッテリーは</text>
  <text class="h1" x="68" y="326">飛行機に持ち込める？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">2個まで・160Wh・</text>
  <text class="sub" x="72" y="478">機内で充電しない</text>

  <!-- 飛行機 -->
  <g transform="translate(880 120) rotate(-15)">
    <rect x="0" y="40" width="200" height="34" rx="17" fill="#173D38"/>
    <path d="M80 40 L130 -20 L150 -20 L120 40z" fill="#5E7B49"/>
    <path d="M80 74 L130 134 L150 134 L120 74z" fill="#5E7B49"/>
    <path d="M10 40 L0 10 L20 10 L35 40z" fill="#5E7B49"/>
  </g>
  <!-- バッテリー2個 -->
  <g transform="translate(740 300)">
    <rect width="120" height="190" rx="18" fill="#173D38"/>
    <rect x="20" y="24" width="80" height="22" rx="6" fill="#9DB383"/>
    <text class="tag" x="60" y="120">1</text>
  </g>
  <g transform="translate(880 300)">
    <rect width="120" height="190" rx="18" fill="#173D38"/>
    <rect x="20" y="24" width="80" height="22" rx="6" fill="#9DB383"/>
    <text class="tag" x="60" y="120">2</text>
  </g>
  <text class="lbl" x="870" y="520">160Wh以下・2個まで</text>
  <!-- 充電禁止 -->
  <g transform="translate(1060 380)">
    <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#C25B4A" stroke-width="7"/>
    <path d="M6 -26 l-18 30 h14 l-8 22 l24 -34 h-14 l8 -18z" fill="#E8B04B"/>
    <line x1="-30" y1="-30" x2="30" y2="30" stroke="#C25B4A" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品や表示ではありません</text>
</svg>
