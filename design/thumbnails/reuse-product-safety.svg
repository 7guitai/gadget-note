<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：リユース品の確認（値札の付いた家電、チェックリスト、虫めがね）。メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .price { font-size: 20px; font-weight: 800; }
      .chk { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 解説</text>
  <text class="h1" x="68" y="252">中古家電・もらい物</text>
  <text class="h1" x="68" y="326">は大丈夫？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">使う前の5つのチェック</text>

  <!-- 家電（除湿機風の箱） -->
  <g transform="translate(720 170)">
    <rect width="190" height="250" rx="22" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
    <rect x="28" y="30" width="134" height="60" rx="10" fill="#E6EBE1"/>
    <path d="M40 130 h110 M40 155 h110 M40 180 h110 M40 205 h110" stroke="#C9D8B4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="60" r="10" fill="#7C9A5E"/>
  </g>
  <!-- 値札 -->
  <g transform="translate(870 150) rotate(12)">
    <path d="M0 0 h90 l24 26 l-24 26 h-90 z" fill="#E8B04B"/>
    <circle cx="96" cy="26" r="6" fill="#F6F2EA"/>
    <text class="price" x="40" y="34" text-anchor="middle">USED</text>
  </g>
  <!-- チェックリスト -->
  <g transform="translate(950 270)">
    <rect width="170" height="200" rx="14" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <g fill="none" stroke="#5E7B49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 42 l10 10 l18 -20"/><path d="M22 92 l10 10 l18 -20"/><path d="M22 142 l10 10 l18 -20"/>
    </g>
    <path d="M66 44 h80 M66 94 h80 M66 144 h80" stroke="#C9D8B4" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- 虫めがね -->
  <g transform="translate(690 380)">
    <circle cx="50" cy="50" r="42" fill="#FFFFFF" fill-opacity=".7" stroke="#173D38" stroke-width="8"/>
    <path d="M82 82 L120 120" stroke="#173D38" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text class="tag" x="930" y="545" text-anchor="middle">リコール・製造年・電池・説明書・改造</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
