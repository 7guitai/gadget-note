<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：スマホのバッテリーを長持ちさせる充電の設定（スマホ、充電の目盛り、温度計） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 設定の使い方</text>
  <text class="h1" x="68" y="258">スマホのバッテリー</text>
  <text class="h1" x="68" y="336">長持ちさせる設定</text>
  <rect x="72" y="382" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="442">充電の上限・最適化と</text>
  <text class="sub" x="72" y="484">熱を避ける使い方</text>

  <!-- スマホ（一般的な形） -->
  <g transform="translate(730 130)">
    <rect width="180" height="340" rx="30" fill="#173D38"/>
    <rect x="14" y="20" width="152" height="300" rx="18" fill="#FFFFFF"/>
    <!-- 電池アイコン -->
    <rect x="40" y="80" width="90" height="170" rx="14" fill="none" stroke="#173D38" stroke-width="6"/>
    <rect x="70" y="66" width="30" height="14" rx="4" fill="#173D38"/>
    <rect x="50" y="122" width="70" height="118" rx="8" fill="#7C9A5E"/>
    <line x1="34" y1="122" x2="136" y2="122" stroke="#C9B593" stroke-width="4" stroke-dasharray="8 6"/>
  </g>
  <text class="tag" x="820" y="510">上限を決めて充電</text>

  <!-- 温度計 -->
  <g transform="translate(1000 180)">
    <rect x="20" y="0" width="36" height="200" rx="18" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <circle cx="38" cy="220" r="34" fill="#E9C9B8"/>
    <rect x="31" y="90" width="14" height="130" rx="7" fill="#E9C9B8"/>
    <line x1="64" y1="40" x2="80" y2="40" stroke="#B9C2B3" stroke-width="4"/>
    <line x1="64" y1="80" x2="80" y2="80" stroke="#B9C2B3" stroke-width="4"/>
    <line x1="64" y1="120" x2="80" y2="120" stroke="#B9C2B3" stroke-width="4"/>
  </g>
  <text class="tag" x="1040" y="510">熱を避ける</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の画面や製品の形ではありません</text>
</svg>
