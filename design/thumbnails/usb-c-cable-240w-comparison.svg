<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：240W対応USB-Cケーブルの比較（3本のケーブルと、充電・耐久・映像のアイコン） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 比較</text>
  <text class="h1" x="68" y="256">240W対応の</text>
  <text class="h1" x="68" y="332">USB-Cケーブル</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">充電だけ・高耐久・</text>
  <text class="sub" x="72" y="480">映像出力も</text>

  <!-- ケーブル3本 -->
  <g stroke-linecap="round" fill="none" stroke-width="14">
    <path d="M720 170 C 800 170, 820 260, 900 260 S 1000 170, 1080 170" stroke="#9DB383"/>
    <path d="M720 300 C 800 300, 820 390, 900 390 S 1000 300, 1080 300" stroke="#5E7B49"/>
    <path d="M720 430 C 800 430, 820 520, 900 520 S 1000 430, 1080 430" stroke="#173D38"/>
  </g>
  <g fill="#FFFFFF" stroke="#173D38" stroke-width="4">
    <rect x="680" y="155" width="44" height="30" rx="8"/><rect x="1076" y="155" width="44" height="30" rx="8"/>
    <rect x="680" y="285" width="44" height="30" rx="8"/><rect x="1076" y="285" width="44" height="30" rx="8"/>
    <rect x="680" y="415" width="44" height="30" rx="8"/><rect x="1076" y="415" width="44" height="30" rx="8"/>
  </g>
  <!-- アイコン：充電（稲妻）・耐久（盾）・映像（モニター） -->
  <path d="M905 205 l-14 26 h12 l-6 22 l20 -30 h-12 l8 -18z" fill="#E8B04B"/>
  <path d="M900 330 l20 7 v14 c0 12 -9 20 -20 24 c-11 -4 -20 -12 -20 -24 v-14z" fill="#FFFFFF" stroke="#5E7B49" stroke-width="4"/>
  <g transform="translate(878 456)"><rect width="44" height="30" rx="4" fill="#FFFFFF" stroke="#173D38" stroke-width="4"/><rect x="16" y="32" width="12" height="6" fill="#173D38"/></g>
  <text class="tag" x="1098" y="216">充電</text>
  <text class="tag" x="1098" y="346">耐久</text>
  <text class="tag" x="1098" y="476">映像</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
