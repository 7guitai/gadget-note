<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：デスクライトの選び方（机を照らすライトと、明るさの範囲） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 68px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">家具 ／ デスクまわりの選び方</text>
  <text class="h1" x="68" y="264">デスクライトの</text>
  <text class="h1" x="68" y="350">選び方</text>
  <rect x="72" y="394" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="454">明るさ・光の色・</text>
  <text class="sub" x="72" y="496">置き場所を確認</text>

  <!-- 光の広がり -->
  <path d="M900 200 L 760 470 L 1080 470 Z" fill="#F3E9C6" opacity=".9"/>

  <!-- 机 -->
  <rect x="680" y="470" width="460" height="26" rx="8" fill="#D9C7A8"/>
  <rect x="710" y="496" width="20" height="80" rx="6" fill="#C9B593"/>
  <rect x="1090" y="496" width="20" height="80" rx="6" fill="#C9B593"/>

  <!-- ノート -->
  <rect x="840" y="446" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="2"/>

  <!-- デスクライト（一般的な形） -->
  <rect x="1040" y="452" width="80" height="18" rx="8" fill="#173D38"/>
  <path d="M1080 452 L 1060 300 L 920 190" fill="none" stroke="#5E7B49" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1060" cy="300" r="12" fill="#173D38"/>
  <path d="M870 170 h 100 a 16 16 0 0 1 0 32 h -100 a 16 16 0 0 1 0 -32z" fill="#173D38" transform="rotate(20 920 186)"/>

  <!-- ラベル -->
  <text class="tag" x="900" y="545">手元の明るさを確認</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
