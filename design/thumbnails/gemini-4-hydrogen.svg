<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Gemini 4 Hydrogen（軽やかな円のモデル、スピードの線、検索窓と吹き出し）。企業ロゴや実在の画面は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 解説</text>
  <text class="h1" x="68" y="252">Gemini 4 Hydrogen</text>
  <text class="h1" x="68" y="326">とは？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">無料でも使えるGemini 4</text>

  <!-- 円のモデル -->
  <g transform="translate(880 250)">
    <circle r="76" fill="#C9D8B4"/>
    <circle r="50" fill="#7C9A5E"/>
    <circle r="22" fill="#173D38"/>
  </g>
  <!-- スピードの線 -->
  <g stroke="#E8B04B" stroke-width="7" stroke-linecap="round">
    <line x1="700" y1="220" x2="770" y2="220"/>
    <line x1="720" y1="250" x2="790" y2="250"/>
    <line x1="700" y1="280" x2="770" y2="280"/>
  </g>
  <!-- 検索窓 -->
  <rect x="730" y="370" width="300" height="52" rx="26" fill="#FFFFFF" stroke="#C9D8B4" stroke-width="4"/>
  <circle cx="764" cy="396" r="11" fill="none" stroke="#173D38" stroke-width="5"/>
  <line x1="772" y1="404" x2="782" y2="414" stroke="#173D38" stroke-width="5" stroke-linecap="round"/>
  <rect x="798" y="389" width="180" height="14" rx="7" fill="#C9D8B4"/>
  <!-- 吹き出し -->
  <g transform="translate(1000 170)">
    <rect width="100" height="64" rx="16" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <path d="M24 64 L18 84 L44 64" fill="#FFFFFF" stroke="#173D38" stroke-width="5" stroke-linejoin="round"/>
    <rect x="18" y="20" width="64" height="8" rx="4" fill="#9DB383"/>
    <rect x="18" y="36" width="44" height="8" rx="4" fill="#C9D8B4"/>
  </g>
  <text class="tag" x="880" y="480" text-anchor="middle">Geminiアプリと検索で順次提供</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の画面ではありません</text>
</svg>
