<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Geminiの会話の保存設定（吹き出し、鍵、スイッチ）。企業ロゴや実在の画面は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 解説</text>
  <text class="h1" x="68" y="252">Geminiの会話は</text>
  <text class="h1" x="68" y="326">保存される？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">アクティビティの保存・</text>
  <text class="sub" x="72" y="478">一時チャット・削除</text>

  <!-- 吹き出し -->
  <g transform="translate(720 140)">
    <rect width="260" height="110" rx="22" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <path d="M60 108 l-6 30 l34 -30z" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3" stroke-linejoin="round"/>
    <rect x="52" y="104" width="40" height="8" fill="#FFFFFF"/>
    <rect x="28" y="30" width="200" height="14" rx="7" fill="#C9D8B4"/>
    <rect x="28" y="62" width="140" height="14" rx="7" fill="#C9D8B4"/>
  </g>
  <!-- 鍵 -->
  <g transform="translate(1010 170)">
    <path d="M20 50 v-18 a30 30 0 0 1 60 0 v18" fill="none" stroke="#173D38" stroke-width="12"/>
    <rect x="0" y="48" width="100" height="80" rx="14" fill="#173D38"/>
    <circle cx="50" cy="82" r="10" fill="#E8B04B"/>
    <rect x="46" y="86" width="8" height="22" rx="4" fill="#E8B04B"/>
  </g>
  <!-- スイッチ -->
  <g transform="translate(760 340)">
    <rect width="150" height="64" rx="32" fill="#5E7B49"/>
    <circle cx="118" cy="32" r="24" fill="#FFFFFF"/>
    <rect x="200" width="150" height="64" rx="32" fill="#C9D8B4"/>
    <circle cx="232" cy="32" r="24" fill="#FFFFFF"/>
  </g>
  <text class="tag" x="835" y="440">保存オン</text>
  <text class="tag" x="1035" y="440">保存オフ</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の画面ではありません</text>
</svg>
