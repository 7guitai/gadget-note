<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：昇降デスク（高さを変えられる机、上下の矢印、目盛り） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">家具 ／ 選び方</text>
  <text class="h1" x="68" y="258">昇降デスクを</text>
  <text class="h1" x="68" y="336">選ぶ前に</text>
  <rect x="72" y="382" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="442">高さの範囲・耐荷重・</text>
  <text class="sub" x="72" y="484">天板の確認ポイント</text>

  <!-- モニター -->
  <rect x="800" y="130" width="160" height="96" rx="8" fill="#173D38"/>
  <rect x="810" y="140" width="140" height="76" rx="4" fill="#C9D8B4"/>
  <rect x="872" y="226" width="16" height="24" fill="#173D38"/>
  <!-- 天板 -->
  <rect x="700" y="250" width="360" height="22" rx="6" fill="#7C9A5E"/>
  <!-- 脚（上下に伸びる） -->
  <rect x="740" y="272" width="30" height="110" fill="#5E7B49"/>
  <rect x="746" y="382" width="18" height="100" fill="#173D38"/>
  <rect x="990" y="272" width="30" height="110" fill="#5E7B49"/>
  <rect x="996" y="382" width="18" height="100" fill="#173D38"/>
  <rect x="715" y="482" width="80" height="14" rx="6" fill="#173D38"/>
  <rect x="965" y="482" width="80" height="14" rx="6" fill="#173D38"/>
  <!-- 上下の矢印 -->
  <g stroke="#9DB383" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="880" y1="300" x2="880" y2="450"/>
    <path d="M862 318 l18 -20 l18 20"/>
    <path d="M862 432 l18 20 l18 -20"/>
  </g>
  <text class="tag" x="880" y="535">座る高さ ↔ 立つ高さ</text>

  <!-- 目盛り -->
  <g stroke="#173D38" stroke-width="4" stroke-linecap="round">
    <line x1="1100" y1="240" x2="1100" y2="496"/>
    <line x1="1090" y1="260" x2="1110" y2="260"/>
    <line x1="1090" y1="300" x2="1110" y2="300"/>
    <line x1="1090" y1="340" x2="1110" y2="340"/>
    <line x1="1090" y1="380" x2="1110" y2="380"/>
    <line x1="1090" y1="420" x2="1110" y2="420"/>
    <line x1="1090" y1="460" x2="1110" y2="460"/>
  </g>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
