<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：海外旅行の免税範囲（スーツケース、お酒のボトル、香水、ショッピングバッグ） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">お土産 ／ 解説</text>
  <text class="h1" x="68" y="252">海外のお土産は</text>
  <text class="h1" x="68" y="326">いくらまで免税？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">お酒3本・たばこ・</text>
  <text class="sub" x="72" y="478">20万円の範囲と申告</text>

  <!-- スーツケース -->
  <g transform="translate(720 250)">
    <rect x="50" y="-36" width="80" height="46" rx="14" fill="none" stroke="#173D38" stroke-width="12"/>
    <rect width="180" height="230" rx="20" fill="#173D38"/>
    <rect x="40" y="20" width="10" height="190" rx="5" fill="#2E5149"/>
    <rect x="130" y="20" width="10" height="190" rx="5" fill="#2E5149"/>
  </g>
  <!-- ボトル3本 -->
  <g fill="#5E7B49">
    <g transform="translate(940 230)"><rect x="12" y="0" width="16" height="30" rx="4"/><rect x="0" y="26" width="40" height="110" rx="10"/></g>
    <g transform="translate(990 230)"><rect x="12" y="0" width="16" height="30" rx="4"/><rect x="0" y="26" width="40" height="110" rx="10"/></g>
    <g transform="translate(1040 230)"><rect x="12" y="0" width="16" height="30" rx="4"/><rect x="0" y="26" width="40" height="110" rx="10"/></g>
  </g>
  <text class="tag" x="1020" y="396">3本まで</text>
  <!-- 香水 -->
  <g transform="translate(950 120)">
    <rect x="14" y="0" width="22" height="18" rx="4" fill="#9DB383"/>
    <rect x="0" y="16" width="50" height="50" rx="12" fill="#C9D8B4" stroke="#7C9A5E" stroke-width="3"/>
  </g>
  <!-- ショッピングバッグ -->
  <g transform="translate(1030 110)">
    <path d="M20 20 a20 20 0 0 1 40 0" fill="none" stroke="#7C9A5E" stroke-width="5"/>
    <rect x="0" y="20" width="80" height="70" rx="8" fill="#E8B04B"/>
  </g>
  <text class="tag" x="1010" y="460">その他 20万円</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の商品ではありません</text>
</svg>
