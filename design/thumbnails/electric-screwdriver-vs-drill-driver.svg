<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：電動ドライバーとドリルドライバーの違い（2つの工具の一般的な形とネジ） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 20px; font-weight: 700; fill: #5E7B49; letter-spacing: .02em; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">道具 ／ 違いを整理</text>
  <text class="h1" x="68" y="262">電動ドライバーと</text>
  <text class="h1" x="68" y="346">ドリルドライバー</text>
  <rect x="72" y="392" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="452">家具の組み立てなら</text>
  <text class="sub" x="72" y="494">どっちを選ぶ？</text>

  <!-- 小さな電動ドライバー（一般的な棒状） -->
  <g transform="translate(720 190)">
    <rect x="0" y="0" width="64" height="170" rx="26" fill="#7C9A5E"/>
    <rect x="12" y="34" width="40" height="22" rx="8" fill="#C9D8B4"/>
    <rect x="24" y="170" width="16" height="26" rx="4" fill="#173D38"/>
    <rect x="29" y="196" width="6" height="40" rx="2" fill="#B9C2B3"/>
  </g>
  <text class="tag" x="752" y="470">電動ドライバー</text>

  <!-- ドリルドライバー（一般的なピストル形） -->
  <g transform="translate(890 170)">
    <path d="M20 20 h150 a30 30 0 0 1 30 30 v20 a30 30 0 0 1 -30 30 h-80 l-6 100 h-60 l10 -100 h-14 a30 30 0 0 1 -30 -30 v-20 a30 30 0 0 1 30 -30z" fill="#173D38"/>
    <rect x="200" y="36" width="34" height="38" rx="8" fill="#5E7B49"/>
    <rect x="234" y="50" width="40" height="10" rx="3" fill="#B9C2B3"/>
    <rect x="20" y="200" width="86" height="40" rx="10" fill="#7C9A5E"/>
    <circle cx="120" cy="56" r="10" fill="#C9D8B4"/>
  </g>
  <text class="tag" x="1010" y="470">ドリルドライバー</text>

  <!-- ネジ -->
  <g transform="translate(1150 330) rotate(20)">
    <rect x="-14" y="0" width="28" height="10" rx="4" fill="#5E7B49"/>
    <path d="M-6 10 h12 l-2 40 l-4 10 l-4 -10z" fill="#5E7B49"/>
  </g>

  <text class="cap" x="760" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
