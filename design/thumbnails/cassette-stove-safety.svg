<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：カセットこんろと土鍋、カセットボンベ、注意マーク。一般的な形で、メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .warn { font-size: 46px; font-weight: 800; fill: #173D38; }
      .t { font-size: 22px; font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 解説</text>
  <text class="h1" x="68" y="252">カセットボンベの</text>
  <text class="h1" x="68" y="326">破裂を防ぐには？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">2台並べ・高温の保管はNG</text>

  <!-- 土鍋 -->
  <path d="M740 250 Q740 190 850 190 Q960 190 960 250 Z" fill="#7C9A5E" stroke="#173D38" stroke-width="6"/>
  <rect x="835" y="172" width="30" height="20" rx="8" fill="#173D38"/>
  <rect x="725" y="250" width="250" height="22" rx="10" fill="#5E7B49" stroke="#173D38" stroke-width="5"/>
  <!-- 湯気 -->
  <path d="M800 160 q-12 -20 0 -40 q12 -20 0 -40" fill="none" stroke="#C9D8B4" stroke-width="6" stroke-linecap="round"/>
  <path d="M900 160 q-12 -20 0 -40 q12 -20 0 -40" fill="none" stroke="#C9D8B4" stroke-width="6" stroke-linecap="round"/>
  <!-- カセットこんろ -->
  <rect x="700" y="285" width="300" height="110" rx="16" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
  <rect x="720" y="300" width="80" height="80" rx="10" fill="#E6EBE1" stroke="#173D38" stroke-width="4"/>
  <circle cx="930" cy="340" r="22" fill="#E6EBE1" stroke="#173D38" stroke-width="5"/>
  <path d="M930 340 L930 322" stroke="#173D38" stroke-width="5" stroke-linecap="round"/>
  <!-- カセットボンベ（外したもの） -->
  <g transform="translate(1030 250)">
    <rect width="60" height="150" rx="14" fill="#E8B04B" stroke="#173D38" stroke-width="5"/>
    <rect x="18" y="-16" width="24" height="20" rx="4" fill="#173D38"/>
    <text class="t" x="30" y="95" text-anchor="middle">40</text>
    <text class="t" x="30" y="120" text-anchor="middle">℃</text>
  </g>
  <!-- 注意マーク -->
  <g transform="translate(850 420)">
    <path d="M0 0 L46 80 L-46 80 Z" fill="#E8B04B" stroke="#173D38" stroke-width="5" stroke-linejoin="round"/>
    <text class="warn" x="0" y="72" text-anchor="middle">!</text>
  </g>
  <text class="tag" x="890" y="540" text-anchor="middle">確実にセット・正しく使う・外して保管</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
