<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：サブスクを見直す方法（カレンダー・明細・チェックリスト） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 68px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .card { fill: #FFFFFF; stroke: #D8DDD3; stroke-width: 2; }
      .line { stroke: #D8DDD3; stroke-width: 7; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">暮らし ／ 使い方</text>
  <text class="h1" x="68" y="264">サブスクを</text>
  <text class="h1" x="68" y="350">見直す方法</text>
  <rect x="72" y="394" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="454">使っていないサービスを</text>
  <text class="sub" x="72" y="496">探す3つの手順</text>

  <!-- カレンダー -->
  <g transform="translate(700 120) rotate(-4)">
    <rect class="card" width="220" height="190" rx="18"/>
    <rect x="0" y="0" width="220" height="46" rx="18" fill="#7C9A5E"/>
    <rect x="0" y="28" width="220" height="18" fill="#7C9A5E"/>
    <rect x="50" y="-12" width="12" height="28" rx="6" fill="#173D38"/>
    <rect x="158" y="-12" width="12" height="28" rx="6" fill="#173D38"/>
    <g fill="#E6EBE1">
      <rect x="22" y="66" width="30" height="24" rx="6"/><rect x="66" y="66" width="30" height="24" rx="6"/><rect x="110" y="66" width="30" height="24" rx="6"/><rect x="154" y="66" width="30" height="24" rx="6"/>
      <rect x="22" y="104" width="30" height="24" rx="6"/><rect x="66" y="104" width="30" height="24" rx="6"/><rect x="154" y="104" width="30" height="24" rx="6"/>
      <rect x="22" y="142" width="30" height="24" rx="6"/><rect x="66" y="142" width="30" height="24" rx="6"/><rect x="110" y="142" width="30" height="24" rx="6"/>
    </g>
    <circle cx="125" cy="116" r="17" fill="none" stroke="#173D38" stroke-width="4"/>
  </g>

  <!-- 明細とチェック -->
  <g transform="translate(860 300) rotate(3)">
    <rect class="card" width="260" height="220" rx="18"/>
    <rect x="22" y="28" width="26" height="26" rx="7" fill="#7C9A5E"/>
    <path d="M28 41 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="line" x1="64" y1="41" x2="230" y2="41"/>
    <rect x="22" y="84" width="26" height="26" rx="7" fill="#7C9A5E"/>
    <path d="M28 97 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="line" x1="64" y1="97" x2="210" y2="97"/>
    <rect x="22" y="140" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#9DB383" stroke-width="3"/>
    <line x1="64" y1="153" x2="220" y2="153" stroke="#C9B593" stroke-width="7" stroke-linecap="round"/>
    <line x1="60" y1="153" x2="224" y2="153" stroke="#173D38" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text class="cap" x="760" y="604">※ イメージ。実際の画面やロゴではありません</text>
</svg>
