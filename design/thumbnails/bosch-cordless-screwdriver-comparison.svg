<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：小型コードレスドライバー2本とドリルドライバー、ネジと家具の板。一般的な形で、メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .v { font-size: 18px; font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">TOOLBOX ／ 比較</text>
  <text class="h1" x="68" y="252">家具の組み立て用</text>
  <text class="h1" x="68" y="326">電動ドライバー比較</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">小型3.6V ×3 と 18V ×1</text>

  <!-- 家具の板 -->
  <rect x="690" y="440" width="420" height="40" rx="6" fill="#E8C99A" stroke="#173D38" stroke-width="5"/>
  <circle cx="760" cy="460" r="7" fill="#173D38"/><circle cx="1040" cy="460" r="7" fill="#173D38"/>
  <!-- L字型の小型ドライバー -->
  <g transform="translate(720 200)">
    <rect x="0" y="0" width="60" height="150" rx="22" fill="#5E7B49" stroke="#173D38" stroke-width="5"/>
    <rect x="0" y="0" width="130" height="56" rx="22" fill="#7C9A5E" stroke="#173D38" stroke-width="5"/>
    <rect x="128" y="20" width="34" height="16" rx="4" fill="#C9D8B4" stroke="#173D38" stroke-width="3"/>
    <text class="v" x="30" y="115" text-anchor="middle">3.6V</text>
  </g>
  <!-- ペン型ドライバー -->
  <g transform="translate(895 130)">
    <rect width="44" height="190" rx="20" fill="#9DB383" stroke="#173D38" stroke-width="5"/>
    <rect x="14" y="188" width="16" height="40" rx="3" fill="#C9D8B4" stroke="#173D38" stroke-width="3"/>
  </g>
  <!-- ドリルドライバー -->
  <g transform="translate(990 230)">
    <rect x="0" y="0" width="140" height="64" rx="24" fill="#173D38"/>
    <rect x="-34" y="20" width="36" height="24" rx="5" fill="#52675F"/>
    <rect x="40" y="56" width="50" height="100" rx="14" fill="#173D38"/>
    <rect x="28" y="150" width="76" height="34" rx="8" fill="#5E7B49"/>
    <text class="v" x="78" y="40" text-anchor="middle">18V</text>
  </g>
  <text class="tag" x="900" y="530" text-anchor="middle">トルク・重さ・充電方法で選ぶ</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
