<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：検索のAIモードでレストラン探し（検索窓、吹き出し、お店カード、時計）。企業ロゴや実在の画面は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 解説</text>
  <text class="h1" x="68" y="252">検索のAIモードで</text>
  <text class="h1" x="68" y="326">レストランの空席を</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">使い方と予約までの流れ</text>

  <!-- 検索窓 -->
  <rect x="720" y="120" width="380" height="60" rx="30" fill="#FFFFFF" stroke="#C9D8B4" stroke-width="4"/>
  <circle cx="760" cy="150" r="13" fill="none" stroke="#173D38" stroke-width="5"/>
  <line x1="769" y1="159" x2="780" y2="170" stroke="#173D38" stroke-width="5" stroke-linecap="round"/>
  <rect x="800" y="142" width="200" height="14" rx="7" fill="#C9D8B4"/>
  <!-- お店カード -->
  <g transform="translate(740 220)">
    <rect width="320" height="70" rx="12" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <rect x="16" y="14" width="42" height="42" rx="8" fill="#9DB383"/>
    <rect x="74" y="20" width="150" height="12" rx="6" fill="#C9D8B4"/><rect x="74" y="42" width="100" height="10" rx="5" fill="#E6EBE1"/>
    <rect x="240" y="22" width="64" height="26" rx="13" fill="#5E7B49"/>
  </g>
  <g transform="translate(740 310)">
    <rect width="320" height="70" rx="12" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <rect x="16" y="14" width="42" height="42" rx="8" fill="#7C9A5E"/>
    <rect x="74" y="20" width="150" height="12" rx="6" fill="#C9D8B4"/><rect x="74" y="42" width="100" height="10" rx="5" fill="#E6EBE1"/>
    <rect x="240" y="22" width="64" height="26" rx="13" fill="#5E7B49"/>
  </g>
  <!-- 時計 -->
  <g transform="translate(1040 450)">
    <circle r="40" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#173D38" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="8" stroke="#E8B04B" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="tag" x="760" y="440">空席をリアルタイムで確認</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の画面ではありません</text>
</svg>
