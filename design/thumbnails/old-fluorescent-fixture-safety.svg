<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：古い蛍光灯器具（天井の器具、中の部品、カレンダー）。メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .yr { font-size: 30px; font-weight: 800; }
      .calh { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 解説</text>
  <text class="h1" x="68" y="252">古い蛍光灯器具は</text>
  <text class="h1" x="68" y="326">大丈夫？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">10年超えの器具とLED化の注意</text>

  <!-- 天井 -->
  <rect x="690" y="130" width="420" height="14" rx="4" fill="#C9D8B4"/>
  <!-- 器具 -->
  <rect x="720" y="150" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
  <rect x="740" y="190" width="320" height="14" rx="7" fill="#E6EBE1"/>
  <!-- 中の部品（安定器） -->
  <g transform="translate(800 260)">
    <rect width="150" height="90" rx="10" fill="#7C9A5E"/>
    <path d="M20 30 h110 M20 50 h110 M20 70 h110" stroke="#C9D8B4" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 30 Q190 20 175 60" fill="none" stroke="#E8B04B" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M875 210 L875 258" stroke="#173D38" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- カレンダー -->
  <g transform="translate(990 300)">
    <rect width="120" height="120" rx="14" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect width="120" height="34" rx="14" fill="#5E7B49"/>
    <rect y="20" width="120" height="14" fill="#5E7B49"/>
    <text class="calh" x="60" y="25" text-anchor="middle">YEARS</text>
    <text class="yr" x="60" y="92" text-anchor="middle">10+</text>
  </g>
  <text class="tag" x="875" y="480" text-anchor="middle">見た目がきれいでも中は劣化</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
