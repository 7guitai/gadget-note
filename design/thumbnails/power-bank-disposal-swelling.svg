<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：モバイルバッテリーの捨て方（本体と絶縁テープ、回収ボックス、ふたつきの缶） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 安全</text>
  <text class="h1" x="68" y="252">モバイルバッテリーの</text>
  <text class="h1" x="68" y="326">捨て方</text>
  <rect x="72" y="372" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="432">ふつうのごみに混ぜない・</text>
  <text class="sub" x="72" y="474">膨らんだときの対処</text>

  <!-- モバイルバッテリーと絶縁テープ -->
  <g transform="translate(700 170)">
    <rect width="110" height="190" rx="18" fill="#173D38"/>
    <rect x="20" y="-8" width="70" height="30" rx="6" fill="#DCE8F0" opacity=".85" stroke="#9DB3C3" stroke-width="2"/>
    <rect x="30" y="80" width="50" height="26" rx="6" fill="#5E7B49"/>
  </g>
  <text class="tag" x="755" y="400">端子をテープで</text>

  <!-- 回収ボックス -->
  <g transform="translate(860 200)">
    <rect width="150" height="170" rx="12" fill="#5E7B49"/>
    <rect x="30" y="24" width="90" height="12" rx="6" fill="#173D38"/>
    <path d="M75 70 l18 30 h-36z M58 112 l-18 30 h36z M92 112 l18 30 h-36z" fill="#C9D8B4"/>
  </g>
  <text class="tag" x="935" y="400">回収に出す</text>

  <!-- ふたつきの金属缶 -->
  <g transform="translate(1040 260)">
    <rect x="0" y="0" width="110" height="18" rx="6" fill="#7C9A5E"/>
    <rect x="6" y="18" width="98" height="110" rx="8" fill="#9DB383"/>
    <line x1="6" y1="50" x2="104" y2="50" stroke="#7C9A5E" stroke-width="4"/>
    <line x1="6" y1="96" x2="104" y2="96" stroke="#7C9A5E" stroke-width="4"/>
  </g>
  <text class="tag" x="1095" y="420">膨らんだら</text>
  <text class="tag" x="1095" y="444">金属の容器へ</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品や回収ボックスではありません</text>
</svg>
