<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：モニターアームの比較（1本アームと2本アーム）。商品の形は一般的な形、ロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">FURNITURE ／ 比較</text>
  <text class="h1" x="68" y="252">モニターアームを</text>
  <text class="h1" x="68" y="326">比較</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">3軸・4軸・2画面の違い</text>

  <!-- 机 -->
  <rect x="680" y="440" width="460" height="22" rx="6" fill="#7C9A5E"/>
  <!-- 1本アーム -->
  <rect x="730" y="250" width="16" height="190" rx="6" fill="#173D38"/>
  <rect x="722" y="430" width="32" height="44" rx="6" fill="#173D38"/>
  <path d="M738 280 L800 250 L840 270" fill="none" stroke="#173D38" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="830" y="190" width="18" height="120" rx="4" fill="#3F5A50"/>
  <rect x="846" y="170" width="20" height="160" rx="6" fill="#173D38"/>
  <!-- 2本アーム -->
  <rect x="1000" y="230" width="16" height="210" rx="6" fill="#173D38"/>
  <rect x="992" y="430" width="32" height="44" rx="6" fill="#173D38"/>
  <path d="M1008 260 L950 235 L920 250" fill="none" stroke="#5E7B49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1008 260 L1066 235 L1096 250" fill="none" stroke="#5E7B49" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="900" y="170" width="20" height="150" rx="6" fill="#9DB383"/>
  <rect x="1096" y="170" width="20" height="150" rx="6" fill="#9DB383"/>
  <text class="tag" x="910" y="510" text-anchor="middle">耐荷重・天板の厚さを確認</text>

  <text class="cap" x="640" y="604">※ イメージイラスト。実際の製品の形とは異なります</text>
</svg>
