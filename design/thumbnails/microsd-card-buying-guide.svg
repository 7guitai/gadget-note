<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：microSDカードの選び方（カードと表記のマーク） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 62px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .mark { font-size: 30px; font-weight: 800; fill: #173D38; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 選び方</text>
  <text class="h1" x="68" y="258">microSDカード</text>
  <text class="h1" x="68" y="338">の選び方</text>
  <rect x="72" y="384" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="444">SDXC・U3・V30・A2の</text>
  <text class="sub" x="72" y="486">表記の読み方</text>

  <!-- microSDカード（一般的な形） -->
  <g transform="translate(720 140)">
    <path d="M0 16 a16 16 0 0 1 16 -16 h168 a16 16 0 0 1 16 16 v110 l-14 14 v24 l14 14 v86 a16 16 0 0 1 -16 16 h-168 a16 16 0 0 1 -16 -16z" fill="#173D38"/>
    <rect x="24" y="20" width="16" height="38" rx="4" fill="#C9B593"/>
    <rect x="50" y="20" width="16" height="38" rx="4" fill="#C9B593"/>
    <rect x="76" y="20" width="16" height="38" rx="4" fill="#C9B593"/>
    <rect x="102" y="20" width="16" height="38" rx="4" fill="#C9B593"/>
    <rect x="128" y="20" width="16" height="38" rx="4" fill="#C9B593"/>
    <rect x="24" y="110" width="140" height="120" rx="12" fill="#5E7B49"/>
    <rect x="42" y="136" width="104" height="12" rx="6" fill="#9DB383"/>
    <rect x="42" y="166" width="70" height="12" rx="6" fill="#9DB383"/>
  </g>
  <text class="tag" x="820" y="452">対応する種類を確認</text>

  <!-- 表記のマーク -->
  <g transform="translate(990 150)">
    <rect width="120" height="64" rx="14" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <text class="mark" x="60" y="43">SDXC</text>
    <rect y="84" width="120" height="64" rx="14" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <text class="mark" x="60" y="127">U3</text>
    <rect y="168" width="120" height="64" rx="14" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <text class="mark" x="60" y="211">V30</text>
  </g>
  <text class="tag" x="1050" y="452">パッケージの表記</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の製品やロゴではありません</text>
</svg>
