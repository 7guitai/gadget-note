<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Claude Fable 5.2（段になったモデルの図、カレンダーと時計）。企業ロゴや実在の画面は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .cal { font-size: 40px; font-weight: 800; }
      .calh { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 解説</text>
  <text class="h1" x="68" y="252">Claude Fable 5.2</text>
  <text class="h1" x="68" y="326">が登場</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">Proは11/17まで追加料金なし</text>

  <!-- 段になったモデル -->
  <rect x="720" y="380" width="200" height="56" rx="12" fill="#C9D8B4"/>
  <rect x="750" y="310" width="140" height="56" rx="12" fill="#7C9A5E"/>
  <rect x="780" y="240" width="80" height="56" rx="12" fill="#173D38"/>
  <path d="M820 200 L832 224 L808 224 Z" fill="#E8B04B"/>
  <!-- カレンダー -->
  <g transform="translate(960 170)">
    <rect width="140" height="150" rx="16" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect width="140" height="40" rx="16" fill="#5E7B49"/>
    <rect y="24" width="140" height="16" fill="#5E7B49"/>
    <text class="calh" x="70" y="28" text-anchor="middle">NOV</text>
    <text class="cal" x="70" y="112" text-anchor="middle">17</text>
  </g>
  <!-- 時計 -->
  <g transform="translate(1040 400)">
    <circle r="42" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#173D38" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="10" stroke="#E8B04B" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="tag" x="720" y="480">難しい技術的な作業向け</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の画面ではありません</text>
</svg>
