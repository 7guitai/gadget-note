<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：生成AIの答えを確かめる（吹き出し、虫めがね、資料とチェック） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 使い方</text>
  <text class="h1" x="68" y="256">生成AIの答えを</text>
  <text class="h1" x="68" y="332">確かめる方法</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">出典・日付・数字を</text>
  <text class="sub" x="72" y="480">一次情報で確認</text>

  <!-- 吹き出し（AIの答え） -->
  <g transform="translate(690 140)">
    <rect width="230" height="130" rx="22" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <path d="M40 128 l-8 30 l36 -30z" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3" stroke-linejoin="round"/>
    <rect x="38" y="124" width="32" height="8" fill="#FFFFFF"/>
    <rect x="26" y="30" width="178" height="12" rx="6" fill="#C9D8B4"/>
    <rect x="26" y="58" width="120" height="12" rx="6" fill="#C9D8B4"/>
    <rect x="26" y="86" width="60" height="16" rx="5" fill="#E9C9B8"/>
    <rect x="96" y="86" width="80" height="16" rx="5" fill="#E9C9B8"/>
  </g>
  <text class="tag" x="805" y="330">AIの答え</text>

  <!-- 虫めがね -->
  <g transform="translate(860 210)">
    <circle cx="60" cy="60" r="48" fill="#FFFFFF" fill-opacity=".5" stroke="#173D38" stroke-width="12"/>
    <line x1="96" y1="96" x2="140" y2="140" stroke="#173D38" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- 資料とチェック -->
  <g transform="translate(980 330)">
    <rect width="150" height="190" rx="10" fill="#5E7B49"/>
    <rect x="14" y="14" width="122" height="162" rx="6" fill="#FFFFFF"/>
    <g stroke="#7C9A5E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 50 l10 10 l18 -20"/>
      <path d="M30 100 l10 10 l18 -20"/>
      <path d="M30 150 l10 10 l18 -20"/>
    </g>
    <rect x="68" y="46" width="56" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="68" y="96" width="56" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="68" y="146" width="56" height="10" rx="5" fill="#D8DDD3"/>
  </g>
  <text class="tag" x="1055" y="548">一次情報で確認</text>

  <text class="cap" x="640" y="604">※ イメージ。実際のサービスの画面ではありません</text>
</svg>
