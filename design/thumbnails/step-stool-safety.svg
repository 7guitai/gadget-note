<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：踏み台・足場台の安全（2段の踏み台、足場台、止め金具、チェック） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">道具 ／ 使い方</text>
  <text class="h1" x="68" y="254">踏み台・足場台の</text>
  <text class="h1" x="68" y="328">安全な使い方</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">大掃除の前に確認したい</text>
  <text class="sub" x="72" y="478">4つのポイント</text>

  <!-- 床 -->
  <rect x="700" y="480" width="440" height="10" fill="#C9D8B4"/>
  <!-- 踏み台（2段） -->
  <g transform="translate(730 300)">
    <path d="M10 180 L40 0 H120 L150 180" fill="none" stroke="#5E7B49" stroke-width="12" stroke-linejoin="round"/>
    <rect x="30" y="-10" width="100" height="18" rx="5" fill="#173D38"/>
    <rect x="22" y="80" width="116" height="16" rx="5" fill="#173D38"/>
  </g>
  <!-- 足場台 -->
  <g transform="translate(920 340)">
    <rect x="0" y="0" width="200" height="22" rx="6" fill="#173D38"/>
    <path d="M20 22 L0 140 M180 22 L200 140 M60 22 L50 140 M140 22 L150 140" stroke="#5E7B49" stroke-width="10" stroke-linecap="round"/>
    <path d="M10 90 H60 M140 90 H190" stroke="#7C9A5E" stroke-width="6"/>
    <circle cx="35" cy="90" r="9" fill="#E8B04B"/>
    <circle cx="165" cy="90" r="9" fill="#E8B04B"/>
  </g>
  <text class="tag" x="1020" y="320">止め金具をロック</text>
  <!-- チェック -->
  <circle cx="1060" cy="180" r="40" fill="#FFFFFF" stroke="#5E7B49" stroke-width="6"/>
  <path d="M1040 180 l14 14 l26 -28" stroke="#5E7B49" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
