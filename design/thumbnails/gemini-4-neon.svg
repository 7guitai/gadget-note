<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Gemini 4 Neon（光る管のようなモデルの図、表・書類・グラフ）。企業ロゴや実在の画面は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 解説</text>
  <text class="h1" x="68" y="252">Gemini 4 Neon</text>
  <text class="h1" x="68" y="326">とは？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">Proプランで使える新モデル</text>

  <!-- 光る管 -->
  <g transform="translate(720 140)">
    <rect width="320" height="70" rx="35" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
    <path d="M40 35 Q80 5 120 35 T200 35 T280 35" fill="none" stroke="#E8B04B" stroke-width="10" stroke-linecap="round"/>
    <rect x="-20" y="22" width="22" height="26" rx="4" fill="#173D38"/>
    <rect x="318" y="22" width="22" height="26" rx="4" fill="#173D38"/>
  </g>
  <!-- 表 -->
  <g transform="translate(720 260)">
    <rect width="190" height="170" rx="14" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <path d="M0 50 h190 M0 90 h190 M0 130 h190 M70 0 v170" stroke="#C9D8B4" stroke-width="4"/>
    <rect x="2" y="2" width="186" height="46" rx="12" fill="#5E7B49"/>
  </g>
  <!-- グラフ -->
  <g transform="translate(940 260)">
    <rect width="160" height="170" rx="14" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect x="28" y="100" width="26" height="45" rx="4" fill="#C9D8B4"/>
    <rect x="68" y="70" width="26" height="75" rx="4" fill="#9DB383"/>
    <rect x="108" y="40" width="26" height="105" rx="4" fill="#5E7B49"/>
  </g>
  <text class="tag" x="910" y="490" text-anchor="middle">深い推論と効率を両立</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
