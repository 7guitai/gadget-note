<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：地震後の通電火災（分電盤のブレーカー、コンセント、ガス栓）。人物は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .lbl { font-size: 18px; font-weight: 800; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 解説</text>
  <text class="h1" x="68" y="252">地震のあとの</text>
  <text class="h1" x="68" y="326">通電火災を防ぐには</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">ブレーカー・ガス・復旧時の確認</text>

  <!-- 分電盤 -->
  <rect x="760" y="120" width="260" height="230" rx="18" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
  <rect x="790" y="150" width="200" height="40" rx="8" fill="#E6EBE1"/>
  <g>
    <rect x="800" y="220" width="36" height="96" rx="8" fill="#C9D8B4"/>
    <rect x="806" y="276" width="24" height="34" rx="5" fill="#173D38"/>
    <rect x="852" y="220" width="36" height="96" rx="8" fill="#C9D8B4"/>
    <rect x="858" y="276" width="24" height="34" rx="5" fill="#173D38"/>
    <rect x="904" y="220" width="36" height="96" rx="8" fill="#C9D8B4"/>
    <rect x="910" y="276" width="24" height="34" rx="5" fill="#173D38"/>
  </g>
  <rect x="948" y="236" width="56" height="30" rx="15" fill="#5E7B49"/>
  <text class="lbl" x="976" y="258" text-anchor="middle">OFF</text>
  <path d="M970 190 L970 214" stroke="#E8B04B" stroke-width="5" stroke-linecap="round"/>

  <!-- コンセント -->
  <g transform="translate(760 400)">
    <rect width="130" height="110" rx="16" fill="#FFFFFF" stroke="#C9D8B4" stroke-width="4"/>
    <rect x="40" y="30" width="8" height="24" rx="3" fill="#173D38"/>
    <rect x="82" y="30" width="8" height="30" rx="3" fill="#173D38"/>
    <path d="M52 76 Q65 88 78 76" fill="none" stroke="#173D38" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- ガス栓 -->
  <g transform="translate(920 400)">
    <rect width="130" height="110" rx="16" fill="#FFFFFF" stroke="#C9D8B4" stroke-width="4"/>
    <rect x="30" y="46" width="70" height="26" rx="10" fill="#7C9A5E"/>
    <rect x="56" y="24" width="18" height="30" rx="6" fill="#E8B04B"/>
    <rect x="96" y="52" width="22" height="14" rx="5" fill="#173D38"/>
  </g>
  <text class="tag" x="1040" y="380" text-anchor="end">切る！閉める！</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
