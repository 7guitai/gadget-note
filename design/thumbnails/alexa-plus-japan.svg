<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Alexa+が日本で提供開始（スマートスピーカー、吹き出し、照明・エアコン） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 解説</text>
  <text class="h1" x="68" y="256">Alexa+が</text>
  <text class="h1" x="68" y="332">日本で提供開始</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">できること・料金・</text>
  <text class="sub" x="72" y="480">使い始める方法</text>

  <!-- スマートスピーカー（一般的な円柱形） -->
  <g transform="translate(730 250)">
    <ellipse cx="90" cy="20" rx="90" ry="24" fill="#5E7B49"/>
    <rect x="0" y="20" width="180" height="200" fill="#173D38"/>
    <ellipse cx="90" cy="220" rx="90" ry="24" fill="#173D38"/>
    <ellipse cx="90" cy="20" rx="70" ry="16" fill="none" stroke="#9DB383" stroke-width="6"/>
    <g fill="#2E5149">
      <circle cx="50" cy="90" r="5"/><circle cx="70" cy="90" r="5"/><circle cx="90" cy="90" r="5"/><circle cx="110" cy="90" r="5"/><circle cx="130" cy="90" r="5"/>
      <circle cx="50" cy="110" r="5"/><circle cx="70" cy="110" r="5"/><circle cx="90" cy="110" r="5"/><circle cx="110" cy="110" r="5"/><circle cx="130" cy="110" r="5"/>
    </g>
  </g>

  <!-- 吹き出し -->
  <g transform="translate(710 110)">
    <rect width="220" height="90" rx="20" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <path d="M90 88 l4 28 l26 -28z" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3" stroke-linejoin="round"/>
    <rect x="88" y="84" width="34" height="8" fill="#FFFFFF"/>
    <rect x="26" y="26" width="168" height="12" rx="6" fill="#C9D8B4"/>
    <rect x="26" y="52" width="110" height="12" rx="6" fill="#C9D8B4"/>
  </g>

  <!-- 照明 -->
  <g transform="translate(990 200)">
    <circle cx="50" cy="50" r="34" fill="#F3E3B0"/>
    <rect x="36" y="82" width="28" height="18" rx="4" fill="#7C9A5E"/>
    <g stroke="#F3E3B0" stroke-width="6" stroke-linecap="round">
      <line x1="50" y1="0" x2="50" y2="8"/>
      <line x1="0" y1="50" x2="8" y2="50"/>
      <line x1="92" y1="50" x2="100" y2="50"/>
    </g>
  </g>
  <!-- エアコン -->
  <g transform="translate(970 340)">
    <rect width="150" height="56" rx="12" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <rect x="16" y="38" width="118" height="6" rx="3" fill="#9DB383"/>
    <g stroke="#9DB383" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M40 66 q6 10 0 20"/><path d="M75 66 q6 10 0 20"/><path d="M110 66 q6 10 0 20"/>
    </g>
  </g>
  <text class="tag" x="1045" y="480">家電も声で</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
