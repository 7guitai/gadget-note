<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：除雪機の安全（一般的な形の除雪機、雪、雪かき棒、注意マーク）。人物は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">道具 ／ 解説</text>
  <text class="h1" x="68" y="254">除雪機の事故を</text>
  <text class="h1" x="68" y="330">防ぐには？</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">使い始めの12月に多い事故と</text>
  <text class="sub" x="72" y="480">5つの注意点</text>

  <!-- 雪 -->
  <path d="M690 470 Q 800 430 900 460 T 1130 455 L1130 500 L690 500z" fill="#FFFFFF"/>
  <g fill="#FFFFFF"><circle cx="760" cy="150" r="6"/><circle cx="1000" cy="120" r="5"/><circle cx="880" cy="190" r="4"/><circle cx="1080" cy="200" r="6"/><circle cx="820" cy="250" r="5"/></g>
  <!-- 除雪機 -->
  <g transform="translate(760 300)">
    <rect x="0" y="80" width="130" height="80" rx="16" fill="#5E7B49"/>
    <circle cx="65" cy="120" r="30" fill="#7C9A5E" stroke="#173D38" stroke-width="5"/>
    <path d="M45 120 h40 M65 100 v40" stroke="#173D38" stroke-width="5"/>
    <rect x="110" y="60" width="130" height="90" rx="14" fill="#173D38"/>
    <rect x="40" y="20" width="26" height="70" rx="6" fill="#5E7B49" transform="rotate(-15 53 55)"/>
    <path d="M240 90 L300 20" stroke="#173D38" stroke-width="10" stroke-linecap="round"/>
    <rect x="280" y="8" width="50" height="14" rx="6" fill="#173D38"/>
    <circle cx="150" cy="160" r="20" fill="#2E5149"/><circle cx="215" cy="160" r="20" fill="#2E5149"/>
  </g>
  <!-- 注意 -->
  <circle cx="1060" cy="250" r="36" fill="#FFFFFF" stroke="#C25B4A" stroke-width="7"/>
  <rect x="1056" y="230" width="8" height="26" rx="4" fill="#C25B4A"/>
  <circle cx="1060" cy="268" r="5" fill="#C25B4A"/>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
