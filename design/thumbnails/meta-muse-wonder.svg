<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：MetaのAI Muse Wonder（記憶して作業を続けるAIエージェント） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 72px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; letter-spacing: .02em; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .card { fill: #FFFFFF; stroke: #D8DDD3; stroke-width: 2; }
      .line { stroke: #D8DDD3; stroke-width: 6; stroke-linecap: round; }
      .link { fill: none; stroke: #9DB383; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="330" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 新しいモデルを解説</text>
  <text class="h1" x="68" y="268">MetaのAI</text>
  <text class="h1" x="68" y="356">Muse Wonder</text>
  <rect x="72" y="398" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="458">覚えて、やり抜く</text>
  <text class="sub" x="72" y="500">エージェント型のAI</text>

  <!-- 右：つなぐ線 -->
  <path class="link" d="M900 330 C 830 280, 790 230, 760 190"/>
  <path class="link" d="M900 330 C 980 280, 1030 240, 1060 200"/>
  <path class="link" d="M900 330 C 960 400, 1010 440, 1040 470"/>

  <!-- 記憶のカード（Active Memory） -->
  <g transform="translate(672 104) rotate(-5)">
    <rect class="card" width="170" height="128" rx="18"/>
    <rect x="18" y="20" width="44" height="44" rx="12" fill="#E6EBE1"/>
    <path d="M40 34 c-6-8-18-2-12 8 l12 12 l12-12 c6-10-6-16-12-8z" fill="#9DB383"/>
    <line class="line" x1="76" y1="34" x2="148" y2="34"/>
    <line class="line" x1="76" y1="54" x2="128" y2="54"/>
    <line class="line" x1="20" y1="90" x2="148" y2="90"/>
    <line class="line" x1="20" y1="108" x2="110" y2="108"/>
  </g>
  <text class="tag" x="688" y="268">覚えておく</text>

  <!-- チェックリスト（Active Focus） -->
  <g transform="translate(990 112) rotate(4)">
    <rect class="card" width="150" height="150" rx="18"/>
    <rect x="20" y="24" width="24" height="24" rx="7" fill="#7C9A5E"/>
    <path d="M26 36 l5 5 l9-10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="line" x1="58" y1="36" x2="126" y2="36"/>
    <rect x="20" y="64" width="24" height="24" rx="7" fill="#7C9A5E"/>
    <path d="M26 76 l5 5 l9-10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line class="line" x1="58" y1="76" x2="116" y2="76"/>
    <rect x="20" y="104" width="24" height="24" rx="7" fill="#FFFFFF" stroke="#9DB383" stroke-width="3"/>
    <line class="line" x1="58" y1="116" x2="122" y2="116"/>
  </g>
  <text class="tag" x="1030" y="306">やり抜く</text>

  <!-- 地図とルート（作業の例：ランニングコースの計画） -->
  <g transform="translate(968 448) rotate(-3)">
    <rect class="card" width="168" height="112" rx="18"/>
    <path d="M24 84 C 50 40, 80 96, 104 56 S 122 30, 128 46" fill="none" stroke="#9DB383" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>
    <circle cx="24" cy="84" r="8" fill="#7C9A5E"/>
    <path d="M128 22 v26" stroke="#173D38" stroke-width="4" stroke-linecap="round"/>
    <path d="M130 22 h22 l-6 7 l6 7 h-22z" fill="#C9D8B4"/>
  </g>

  <!-- 中央：AIのキャラクター（吹き出しの形） -->
  <g transform="translate(900 330)">
    <path d="M-104 -70 a40 40 0 0 1 40 -40 h128 a40 40 0 0 1 40 40 v104 a40 40 0 0 1 -40 40 h-62 l-34 34 v-34 h-32 a40 40 0 0 1 -40 -40z" fill="#7C9A5E"/>
    <circle cx="-34" cy="-20" r="11" fill="#173D38"/>
    <circle cx="34" cy="-20" r="11" fill="#173D38"/>
    <circle cx="-30" cy="-24" r="3.5" fill="#FFFFFF"/>
    <circle cx="38" cy="-24" r="3.5" fill="#FFFFFF"/>
    <path d="M-18 14 q18 18 36 0" fill="none" stroke="#173D38" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="-62" cy="10" rx="14" ry="8" fill="#E9C9B8" opacity=".9"/>
    <ellipse cx="62" cy="10" rx="14" ry="8" fill="#E9C9B8" opacity=".9"/>
    <!-- きらめき -->
    <path d="M-136 -128 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6z" fill="#C9D8B4"/>
  </g>
  <text class="cap" x="760" y="604">※ イメージ。実際の画面やロゴではありません</text>
</svg>
