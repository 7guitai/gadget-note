<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Macのスクリーンショット（ノートPC、キー、選択範囲）。実在の画面やロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .key { font-size: 20px; font-weight: 800; fill: #173D38; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 使い方</text>
  <text class="h1" x="68" y="252">Macで</text>
  <text class="h1" x="68" y="326">スクリーンショット</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">shift＋command＋3・4・5</text>
  <text class="sub" x="72" y="478">の違いと保存先</text>

  <!-- ノートPC -->
  <g transform="translate(730 120)">
    <rect width="340" height="220" rx="14" fill="#173D38"/>
    <rect x="16" y="16" width="308" height="188" rx="6" fill="#F6F2EA"/>
    <rect x="40" y="40" width="120" height="70" rx="6" fill="#C9D8B4"/>
    <rect x="180" y="40" width="120" height="12" rx="6" fill="#C9D8B4"/>
    <rect x="180" y="64" width="90" height="12" rx="6" fill="#C9D8B4"/>
    <rect x="150" y="100" width="150" height="86" rx="4" fill="none" stroke="#E8B04B" stroke-width="5" stroke-dasharray="12 8"/>
    <path d="M300 186 l0 0" />
    <rect x="-24" y="220" width="388" height="16" rx="6" fill="#5E7B49"/>
  </g>
  <!-- キー -->
  <g transform="translate(730 410)">
    <rect width="96" height="56" rx="10" fill="#FFFFFF" stroke="#7C9A5E" stroke-width="4"/><text class="key" x="48" y="36">shift</text>
    <rect x="112" width="130" height="56" rx="10" fill="#FFFFFF" stroke="#7C9A5E" stroke-width="4"/><text class="key" x="177" y="36">command</text>
    <rect x="258" width="56" height="56" rx="10" fill="#E8B04B"/><text class="key" x="286" y="37">4</text>
  </g>

  <text class="cap" x="640" y="604">※ イメージ。実際の画面ではありません</text>
</svg>
