<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：ベッドガードとベビーカーの安全（ベッド、ガード、ベビーカー、注意マーク）。人物は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">家具 ／ 解説</text>
  <text class="h1" x="68" y="252">ベッドガードは</text>
  <text class="h1" x="68" y="326">何歳から？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">18か月未満は使わない・</text>
  <text class="sub" x="72" y="478">ベビーカーの注意点</text>

  <!-- ベッドとガード -->
  <g transform="translate(720 170)">
    <rect x="0" y="80" width="300" height="50" rx="10" fill="#FFFFFF" stroke="#C9D8B4" stroke-width="4"/>
    <rect x="0" y="130" width="300" height="24" rx="6" fill="#7C9A5E"/>
    <rect x="0" y="40" width="20" height="150" rx="6" fill="#5E7B49"/>
    <rect x="160" y="30" width="140" height="56" rx="8" fill="none" stroke="#173D38" stroke-width="6"/>
    <g stroke="#173D38" stroke-width="5"><line x1="190" y1="30" x2="190" y2="86"/><line x1="230" y1="30" x2="230" y2="86"/><line x1="270" y1="30" x2="270" y2="86"/></g>
  </g>
  <text class="tag" x="950" y="150">18か月から</text>
  <!-- ベビーカー -->
  <g transform="translate(800 390)">
    <path d="M20 20 h120 a50 50 0 0 1 -50 60 h-40 z" fill="#173D38"/>
    <path d="M140 20 l40 -40" stroke="#5E7B49" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="110" r="18" fill="#5E7B49"/><circle cx="130" cy="110" r="18" fill="#5E7B49"/>
    <path d="M40 80 L40 92 M130 80 L130 92" stroke="#5E7B49" stroke-width="6"/>
  </g>
  <!-- 注意 -->
  <circle cx="1060" cy="440" r="32" fill="#FFFFFF" stroke="#C25B4A" stroke-width="6"/>
  <rect x="1056" y="422" width="8" height="24" rx="4" fill="#C25B4A"/>
  <circle cx="1060" cy="456" r="4" fill="#C25B4A"/>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
