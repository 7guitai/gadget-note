<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：ガスこんろの着衣着火（こんろ、炎、鍋、セーターの袖、注意マーク）。人物の顔は描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">くらし ／ 解説</text>
  <text class="h1" x="68" y="252">ガスこんろの</text>
  <text class="h1" x="68" y="326">着衣着火を防ぐ</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">冬に気をつけたい</text>
  <text class="sub" x="72" y="478">4つのポイント</text>

  <!-- こんろ -->
  <rect x="720" y="400" width="380" height="70" rx="12" fill="#173D38"/>
  <g fill="#5E7B49"><circle cx="780" cy="435" r="10"/><circle cx="820" cy="435" r="10"/></g>
  <!-- 炎と鍋 -->
  <g transform="translate(880 330)">
    <path d="M20 70 C 20 40, 40 40, 40 20 C 55 40, 60 50, 60 70z" fill="#5B8FD0"/>
    <path d="M60 70 C 60 45, 75 40, 80 25 C 95 45, 100 55, 100 70z" fill="#5B8FD0"/>
    <path d="M100 70 C 100 40, 120 40, 120 20 C 135 40, 140 50, 140 70z" fill="#5B8FD0"/>
    <rect x="0" y="-40" width="160" height="60" rx="10" fill="#7C9A5E"/>
    <rect x="-30" y="-36" width="34" height="10" rx="5" fill="#7C9A5E"/>
  </g>
  <!-- 袖 -->
  <g transform="translate(1000 230) rotate(25)">
    <rect x="0" y="0" width="150" height="70" rx="30" fill="#C9D8B4"/>
    <g stroke="#9DB383" stroke-width="4"><line x1="10" y1="10" x2="10" y2="60"/><line x1="22" y1="8" x2="22" y2="62"/><line x1="34" y1="6" x2="34" y2="64"/></g>
  </g>
  <!-- 注意 -->
  <circle cx="780" cy="200" r="36" fill="#FFFFFF" stroke="#C25B4A" stroke-width="7"/>
  <rect x="776" y="180" width="8" height="26" rx="4" fill="#C25B4A"/>
  <circle cx="780" cy="218" r="5" fill="#C25B4A"/>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
