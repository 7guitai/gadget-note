<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：PS5の容量を増やす（ゲーム機の一般的な形、外付けSSD、M.2 SSD） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 解説</text>
  <text class="h1" x="68" y="258">PS5の容量を</text>
  <text class="h1" x="68" y="336">増やす方法</text>
  <rect x="72" y="382" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="442">外付けSSDと内蔵SSD（M.2）</text>
  <text class="sub" x="72" y="484">できることの違い</text>

  <!-- ゲーム機（一般的な縦置きの箱） -->
  <g transform="translate(830 110)">
    <rect width="110" height="330" rx="22" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="4"/>
    <rect x="40" y="20" width="30" height="290" rx="12" fill="#173D38"/>
    <rect x="50" y="300" width="10" height="10" rx="2" fill="#9DB383"/>
  </g>

  <!-- 外付けSSD -->
  <g transform="translate(690 330)">
    <rect width="90" height="120" rx="16" fill="#5E7B49"/>
    <rect x="16" y="16" width="58" height="8" rx="4" fill="#9DB383"/>
  </g>
  <path d="M735 330 C 735 290, 800 290, 830 290" stroke="#173D38" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text class="tag" x="735" y="485">USB拡張ストレージ</text>

  <!-- M.2 SSD -->
  <g transform="translate(990 300)">
    <rect width="150" height="44" rx="4" fill="#173D38"/>
    <rect x="12" y="10" width="34" height="24" rx="3" fill="#7C9A5E"/>
    <rect x="54" y="10" width="34" height="24" rx="3" fill="#7C9A5E"/>
    <rect x="96" y="12" width="24" height="20" rx="3" fill="#9DB383"/>
    <rect x="138" y="8" width="12" height="28" fill="#C9B593"/>
  </g>
  <path d="M975 322 h-30" stroke="#9DB383" stroke-width="6" stroke-linecap="round"/>
  <path d="M955 312 l-12 10 l12 10" stroke="#9DB383" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="tag" x="1065" y="395">M.2 SSD</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
