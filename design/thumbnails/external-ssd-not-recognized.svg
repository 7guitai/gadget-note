<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：外付けSSDが認識しないときの確認順（SSDとノートPC、チェックリスト） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .item { font-size: 19px; font-weight: 700; fill: #173D38; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .card { fill: #FFFFFF; stroke: #D8DDD3; stroke-width: 2; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 困ったときの確認</text>
  <text class="h1" x="68" y="260">外付けSSDが</text>
  <text class="h1" x="68" y="342">認識しないとき</text>
  <rect x="72" y="388" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="448">ケーブル・パソコン・</text>
  <text class="sub" x="72" y="490">管理画面の順に確認</text>

  <!-- ノートPC -->
  <g transform="translate(690 140)">
    <rect x="20" y="0" width="240" height="150" rx="12" fill="#173D38"/>
    <rect x="34" y="14" width="212" height="122" rx="6" fill="#FFFFFF"/>
    <text x="140" y="88" text-anchor="middle" style="font-size:44px;font-weight:800;fill:#C9B593">?</text>
    <path d="M0 150 h280 l-14 22 h-252 z" fill="#5E7B49"/>
  </g>

  <!-- ケーブルとSSD -->
  <path d="M960 300 C 1000 300, 1000 240, 1040 240" fill="none" stroke="#5E7B49" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(1030 170)">
    <rect width="96" height="140" rx="18" fill="#173D38"/>
    <rect x="16" y="18" width="64" height="10" rx="5" fill="#5E7B49"/>
  </g>

  <!-- チェックリスト -->
  <g transform="translate(760 360)">
    <rect class="card" width="330" height="170" rx="18"/>
    <rect x="22" y="22" width="26" height="26" rx="7" fill="#7C9A5E"/>
    <path d="M28 35 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="item" x="62" y="42">ケーブル・端子</text>
    <rect x="22" y="72" width="26" height="26" rx="7" fill="#7C9A5E"/>
    <path d="M28 85 l6 6 l10 -12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="item" x="62" y="92">パソコンの状態</text>
    <rect x="22" y="122" width="26" height="26" rx="7" fill="#FFFFFF" stroke="#9DB383" stroke-width="3"/>
    <text class="item" x="62" y="142">ディスクの管理画面</text>
  </g>

  <text class="cap" x="760" y="604">※ イメージ。実際の画面や製品の形ではありません</text>
</svg>
