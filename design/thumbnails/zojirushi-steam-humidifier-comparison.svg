<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：ポット型の加湿器を大きさ違いで3台。一般的な形で、メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .sz { font-size: 18px; font-weight: 800; fill: #173D38; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 比較</text>
  <text class="h1" x="68" y="252">スチーム式加湿器</text>
  <text class="h1" x="68" y="326">4シリーズ比較</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">部屋の広さと給水の回数で選ぶ</text>

  <rect x="690" y="440" width="430" height="10" rx="5" fill="#52675F"/>
  <!-- 小 -->
  <g transform="translate(740 330)">
    <rect x="0" y="0" width="90" height="110" rx="26" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect x="10" y="-14" width="70" height="20" rx="10" fill="#9DB383"/>
    <path d="M45 -24 q-8 -14 0 -28" fill="none" stroke="#C9D8B4" stroke-width="6" stroke-linecap="round"/>
    <text class="sz" x="45" y="140" text-anchor="middle">〜6畳</text>
  </g>
  <!-- 中 -->
  <g transform="translate(860 280)">
    <rect x="0" y="0" width="110" height="160" rx="30" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect x="12" y="-16" width="86" height="22" rx="11" fill="#7C9A5E"/>
    <path d="M55 -28 q-10 -16 0 -32 q10 -16 0 -32" fill="none" stroke="#C9D8B4" stroke-width="6" stroke-linecap="round"/>
    <text class="sz" x="55" y="190" text-anchor="middle">〜13畳</text>
  </g>
  <!-- 大 -->
  <g transform="translate(1000 240)">
    <rect x="0" y="0" width="120" height="200" rx="32" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <rect x="12" y="-18" width="96" height="24" rx="12" fill="#5E7B49"/>
    <path d="M60 -30 q-10 -16 0 -32 q10 -16 0 -32" fill="none" stroke="#9DB383" stroke-width="6" stroke-linecap="round"/>
    <text class="sz" x="60" y="230" text-anchor="middle">〜17畳</text>
  </g>
  <text class="tag" x="900" y="520" text-anchor="middle"> </text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
