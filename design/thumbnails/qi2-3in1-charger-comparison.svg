<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Qi2 3-in-1ワイヤレス充電器の比較（折りたたみパッド、スタンド、冷却付きスタンド） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 3機種比較</text>
  <text class="h1" x="68" y="254">Qi2対応の3-in-1</text>
  <text class="h1" x="68" y="330">ワイヤレス充電器</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">持ち運び・据え置き・</text>
  <text class="sub" x="72" y="478">25Wの違い</text>

  <!-- 1：折りたたみパッド -->
  <g transform="translate(680 380)">
    <rect width="150" height="44" rx="10" fill="#5E7B49"/>
    <circle cx="28" cy="22" r="14" fill="#C9D8B4"/>
    <circle cx="75" cy="22" r="14" fill="#C9D8B4"/>
    <circle cx="122" cy="22" r="14" fill="#C9D8B4"/>
    <line x1="51" y1="4" x2="51" y2="40" stroke="#7C9A5E" stroke-width="3"/>
    <line x1="99" y1="4" x2="99" y2="40" stroke="#7C9A5E" stroke-width="3"/>
  </g>
  <text class="tag" x="755" y="470">持ち運び</text>

  <!-- 2：スタンド -->
  <g transform="translate(870 200)">
    <path d="M30 0 h70 a10 10 0 0 1 10 10 v170 h-90 v-170 a10 10 0 0 1 10 -10z" fill="#173D38"/>
    <circle cx="65" cy="70" r="26" fill="none" stroke="#9DB383" stroke-width="5"/>
    <rect x="0" y="180" width="150" height="44" rx="10" fill="#173D38"/>
    <circle cx="40" cy="202" r="12" fill="#7C9A5E"/>
    <circle cx="110" cy="202" r="12" fill="#7C9A5E"/>
  </g>
  <text class="tag" x="945" y="470">据え置き</text>

  <!-- 3：冷却付きスタンド -->
  <g transform="translate(1040 180)">
    <path d="M24 0 h66 a10 10 0 0 1 10 10 v190 h-86 v-190 a10 10 0 0 1 10 -10z" fill="#5E7B49"/>
    <circle cx="57" cy="70" r="26" fill="none" stroke="#F6F2EA" stroke-width="5"/>
    <g stroke="#F6F2EA" stroke-width="3">
      <line x1="34" y1="140" x2="80" y2="140"/>
      <line x1="34" y1="152" x2="80" y2="152"/>
      <line x1="34" y1="164" x2="80" y2="164"/>
    </g>
    <rect x="-10" y="200" width="130" height="44" rx="10" fill="#5E7B49"/>
  </g>
  <text class="tag" x="1095" y="470">25W・冷却</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
