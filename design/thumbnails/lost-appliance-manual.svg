<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：取扱説明書をなくしたとき（冷蔵庫とラベル、取扱説明書、虫めがね） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .lbl { font-size: 16px; font-weight: 800; fill: #173D38; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">暮らし ／ 使い方</text>
  <text class="h1" x="68" y="256">取扱説明書を</text>
  <text class="h1" x="68" y="332">なくしたとき</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">品番の見つけ方と</text>
  <text class="sub" x="72" y="480">メーカーのサイトの探し方</text>

  <!-- 冷蔵庫（ドアを開けた一般的な形） -->
  <g transform="translate(700 120)">
    <rect width="170" height="380" rx="16" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="4"/>
    <line x1="0" y1="150" x2="170" y2="150" stroke="#D8DDD3" stroke-width="4"/>
    <rect x="16" y="40" width="10" height="70" rx="5" fill="#7C9A5E"/>
    <rect x="16" y="190" width="10" height="70" rx="5" fill="#7C9A5E"/>
    <!-- ラベル -->
    <rect x="62" y="50" width="88" height="56" rx="6" fill="#F3E3B0"/>
    <rect x="72" y="62" width="68" height="8" rx="4" fill="#173D38"/>
    <rect x="72" y="80" width="48" height="8" rx="4" fill="#5E7B49"/>
  </g>
  <text class="tag" x="785" y="540">本体のラベル</text>

  <!-- 取扱説明書 -->
  <g transform="translate(930 220)">
    <rect width="160" height="210" rx="10" fill="#5E7B49"/>
    <rect x="14" y="14" width="132" height="182" rx="6" fill="#FFFFFF"/>
    <rect x="30" y="40" width="100" height="12" rx="6" fill="#C9D8B4"/>
    <rect x="30" y="66" width="80" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="30" y="86" width="90" height="10" rx="5" fill="#D8DDD3"/>
    <rect x="30" y="106" width="70" height="10" rx="5" fill="#D8DDD3"/>
    <text class="lbl" x="30" y="170">PDF</text>
  </g>
  <!-- 虫めがね -->
  <g transform="translate(1040 150)">
    <circle cx="40" cy="40" r="34" fill="#FFFFFF" fill-opacity=".6" stroke="#173D38" stroke-width="10"/>
    <line x1="64" y1="64" x2="96" y2="96" stroke="#173D38" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text class="tag" x="1010" y="470">公式サイトで探す</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の製品やサイトの画面ではありません</text>
</svg>
