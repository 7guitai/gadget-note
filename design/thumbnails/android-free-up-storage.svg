<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Androidの空き容量（スマホ、容量メーター、写真・動画・アプリ、ゴミ箱） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 使い方</text>
  <text class="h1" x="68" y="252">Androidの容量が</text>
  <text class="h1" x="68" y="326">いっぱいのとき</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">空き容量を増やす</text>
  <text class="sub" x="72" y="478">5つの方法</text>

  <!-- スマホ -->
  <g transform="translate(740 130)">
    <rect width="190" height="360" rx="26" fill="#173D38"/>
    <rect x="14" y="30" width="162" height="300" rx="8" fill="#F6F2EA"/>
    <!-- メーター -->
    <rect x="30" y="56" width="130" height="20" rx="10" fill="#E6EBE1"/>
    <rect x="30" y="56" width="118" height="20" rx="10" fill="#C25B4A"/>
    <g fill="#9DB383"><rect x="30" y="100" width="58" height="58" rx="8"/><rect x="102" y="100" width="58" height="58" rx="8"/></g>
    <g fill="#7C9A5E"><rect x="30" y="172" width="58" height="58" rx="8"/><rect x="102" y="172" width="58" height="58" rx="8"/></g>
    <path d="M52 255 l14 10 l-14 10z" fill="#5E7B49"/>
  </g>
  <!-- ゴミ箱 -->
  <g transform="translate(990 330)">
    <rect x="0" y="0" width="90" height="14" rx="6" fill="#5E7B49"/>
    <rect x="30" y="-12" width="30" height="14" rx="5" fill="#5E7B49"/>
    <path d="M8 20 h74 l-8 100 h-58z" fill="#7C9A5E"/>
    <g stroke="#E6EBE1" stroke-width="5"><line x1="30" y1="38" x2="32" y2="104"/><line x1="45" y1="38" x2="45" y2="104"/><line x1="60" y1="38" x2="58" y2="104"/></g>
  </g>
  <path d="M950 240 C 1000 230, 1030 260, 1035 300" stroke="#E8B04B" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M1022 292 l13 12 l9 -16" stroke="#E8B04B" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="cap" x="640" y="604">※ イメージ。実際の画面ではありません</text>
</svg>
