<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：こんろのそばの猫（シルエット風）、コンセント、ガスの元栓。メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">LIFE ／ 解説</text>
  <text class="h1" x="68" y="252">留守中のペットが</text>
  <text class="h1" x="68" y="326">火事を起こす？</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">出かける前の5つの対策</text>

  <!-- こんろ（天板） -->
  <rect x="700" y="300" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
  <circle cx="770" cy="335" r="22" fill="none" stroke="#7C9A5E" stroke-width="6"/>
  <circle cx="930" cy="335" r="22" fill="none" stroke="#7C9A5E" stroke-width="6"/>
  <rect x="710" y="370" width="280" height="90" rx="10" fill="#C9D8B4" stroke="#173D38" stroke-width="6"/>
  <circle cx="800" cy="415" r="14" fill="#173D38"/><circle cx="900" cy="415" r="14" fill="#173D38"/>
  <!-- 猫 -->
  <g transform="translate(850 300)">
    <ellipse cx="0" cy="-60" rx="55" ry="45" fill="#5E7B49"/>
    <circle cx="35" cy="-110" r="32" fill="#5E7B49"/>
    <path d="M12 -132 L18 -165 L36 -138 Z M44 -138 L62 -165 L64 -128 Z" fill="#5E7B49"/>
    <circle cx="28" cy="-112" r="4" fill="#F6F2EA"/><circle cx="46" cy="-112" r="4" fill="#F6F2EA"/>
    <path d="M-55 -60 Q-95 -70 -80 -120" fill="none" stroke="#5E7B49" stroke-width="12" stroke-linecap="round"/>
    <rect x="20" y="-25" width="16" height="30" rx="8" fill="#5E7B49"/>
  </g>
  <!-- 元栓 -->
  <g transform="translate(1060 300)">
    <rect x="-8" y="0" width="16" height="120" fill="#52675F"/>
    <rect x="-30" y="40" width="60" height="16" rx="8" fill="#E8B04B" stroke="#173D38" stroke-width="4"/>
  </g>
  <text class="tag" x="880" y="510" text-anchor="middle">元栓を閉める・ロック・ケージ</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
