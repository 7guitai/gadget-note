<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：家具の転倒防止（本棚、L型金具、突っ張り棒、ストッパー） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 58px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">道具 ／ 選び方</text>
  <text class="h1" x="68" y="256">家具の</text>
  <text class="h1" x="68" y="332">転倒防止グッズ</text>
  <rect x="72" y="378" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="438">L型金具・突っ張り棒・</text>
  <text class="sub" x="72" y="480">ストッパーの組み合わせ</text>

  <!-- 天井と床 -->
  <rect x="720" y="96" width="360" height="10" fill="#C9D8B4"/>
  <rect x="720" y="500" width="360" height="10" fill="#C9D8B4"/>
  <!-- 本棚 -->
  <g transform="translate(800 170)">
    <rect width="200" height="330" rx="6" fill="#5E7B49"/>
    <rect x="14" y="14" width="172" height="90" fill="#F6F2EA"/>
    <rect x="14" y="118" width="172" height="90" fill="#F6F2EA"/>
    <rect x="14" y="222" width="172" height="94" fill="#F6F2EA"/>
    <g fill="#9DB383"><rect x="26" y="40" width="18" height="64"/><rect x="48" y="30" width="18" height="74"/><rect x="70" y="46" width="18" height="58"/></g>
    <g fill="#7C9A5E"><rect x="26" y="140" width="22" height="68"/><rect x="52" y="140" width="22" height="68"/><rect x="120" y="150" width="50" height="58"/></g>
    <g fill="#173D38"><rect x="26" y="246" width="70" height="70"/><rect x="104" y="256" width="70" height="60"/></g>
  </g>
  <!-- 突っ張り棒 -->
  <g fill="#173D38">
    <rect x="818" y="106" width="16" height="64"/><rect x="808" y="106" width="36" height="8" rx="3"/>
    <rect x="966" y="106" width="16" height="64"/><rect x="956" y="106" width="36" height="8" rx="3"/>
  </g>
  <!-- ストッパー -->
  <path d="M790 500 L1010 500 L1010 488 Z" fill="#E8B04B"/>
  <!-- L型金具（拡大図） -->
  <g transform="translate(1040 300)">
    <path d="M0 0 h18 v62 h44 v18 h-62z" fill="#FFFFFF" stroke="#173D38" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="9" cy="20" r="4" fill="#173D38"/><circle cx="42" cy="71" r="4" fill="#173D38"/>
  </g>
  <text class="tag" x="1030" y="410">L型金具</text>
  <text class="tag" x="1000" y="145">突っ張り棒</text>
  <text class="tag" x="1020" y="480">ストッパー</text>

  <text class="cap" x="640" y="604">※ イメージ。実際の取り付け方はハンドブックで確認</text>
</svg>
