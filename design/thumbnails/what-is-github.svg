<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：GitHubとは（フォルダー、枝分かれする線、変更の提案） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ はじめての基本</text>
  <text class="h1" x="68" y="262">GitHubとは？</text>
  <rect x="72" y="306" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="368">リポジトリ・ブランチ・</text>
  <text class="sub" x="72" y="410">プルリクエストの意味と</text>
  <text class="sub" x="72" y="452">AIと使うときの注意</text>

  <!-- フォルダー（リポジトリ） -->
  <g transform="translate(700 120)">
    <path d="M0 24 a14 14 0 0 1 14 -14 h70 l20 22 h96 a14 14 0 0 1 14 14 v120 a14 14 0 0 1 -14 14 h-186 a14 14 0 0 1 -14 -14z" fill="#5E7B49"/>
    <rect x="0" y="46" width="214" height="134" rx="14" fill="#7C9A5E"/>
  </g>
  <text class="tag" x="807" y="336">リポジトリ</text>

  <!-- ブランチの線 -->
  <g stroke-linecap="round" fill="none">
    <line x1="720" y1="440" x2="1110" y2="440" stroke="#173D38" stroke-width="8"/>
    <path d="M800 440 C 840 440, 840 380, 890 380 H 970 C 1020 380, 1020 440, 1060 440" stroke="#9DB383" stroke-width="8"/>
  </g>
  <circle cx="740" cy="440" r="16" fill="#173D38"/>
  <circle cx="880" cy="440" r="16" fill="#173D38"/>
  <circle cx="1060" cy="440" r="20" fill="#173D38"/>
  <circle cx="900" cy="380" r="14" fill="#FFFFFF" stroke="#7C9A5E" stroke-width="6"/>
  <circle cx="960" cy="380" r="14" fill="#FFFFFF" stroke="#7C9A5E" stroke-width="6"/>
  <text class="tag" x="930" y="350">ブランチ</text>
  <text class="tag" x="920" y="490">確認してからマージ</text>

  <!-- 変更の提案（吹き出し） -->
  <g transform="translate(965 150)">
    <rect width="170" height="110" rx="16" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <path d="M40 108 l-6 28 l30 -28z" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3" stroke-linejoin="round"/>
    <rect x="38" y="104" width="30" height="8" fill="#FFFFFF"/>
    <rect x="22" y="26" width="18" height="18" rx="4" fill="#C9D8B4"/>
    <rect x="50" y="30" width="96" height="10" rx="5" fill="#C9D8B4"/>
    <rect x="22" y="58" width="18" height="18" rx="4" fill="#E9C9B8"/>
    <rect x="50" y="62" width="76" height="10" rx="5" fill="#E9C9B8"/>
  </g>
  <text class="tag" x="1050" y="312">変更の提案</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の画面やロゴではありません</text>
</svg>
