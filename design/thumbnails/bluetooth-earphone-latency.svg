<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：Bluetoothイヤホンの音の遅れ（画面と、少し遅れて届く音の波） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 62px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .wave { fill: none; stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 設定と確認</text>
  <text class="h1" x="68" y="260">Bluetoothイヤホン</text>
  <text class="h1" x="68" y="342">音の遅れを減らす</text>
  <rect x="72" y="388" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="448">低遅延モード・</text>
  <text class="sub" x="72" y="490">タイミング調整・接続環境</text>

  <!-- 画面（再生ボタン） -->
  <g transform="translate(700 150)">
    <rect width="240" height="160" rx="18" fill="#173D38"/>
    <rect x="14" y="14" width="212" height="132" rx="10" fill="#FFFFFF"/>
    <circle cx="120" cy="80" r="34" fill="#E6EBE1"/>
    <path d="M110 62 L 138 80 L 110 98 Z" fill="#7C9A5E"/>
  </g>

  <!-- 音の波（少し遅れて届く） -->
  <path class="wave" stroke="#9DB383" d="M955 230 q 15 -24 30 0 t 30 0 t 30 0"/>
  <path class="wave" stroke="#9DB383" d="M965 262 q 15 -24 30 0 t 30 0"/>
  <text class="tag" x="1010" y="310">少し遅れて届く</text>

  <!-- ヘッドホン（一般的な形） -->
  <g transform="translate(960 350)">
    <path d="M20 110 V 80 a 70 70 0 0 1 140 0 V 110" fill="none" stroke="#5E7B49" stroke-width="14" stroke-linecap="round"/>
    <rect x="0" y="90" width="44" height="74" rx="18" fill="#7C9A5E"/>
    <rect x="136" y="90" width="44" height="74" rx="18" fill="#7C9A5E"/>
  </g>

  <!-- 時計マーク -->
  <g transform="translate(760 400)">
    <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <path d="M50 22 V 50 L 70 62" fill="none" stroke="#173D38" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="cap" x="760" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
