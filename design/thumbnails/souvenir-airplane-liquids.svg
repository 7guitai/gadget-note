<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：飛行機でお土産を持ち帰るときの注意（スーツケース、瓶詰め、透明な袋） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 62px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">お土産 ／ 持ち帰りの注意</text>
  <text class="h1" x="68" y="260">飛行機でお土産を</text>
  <text class="h1" x="68" y="342">持ち帰るとき</text>
  <rect x="72" y="388" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="448">国際線ではジャムや味噌も</text>
  <text class="sub" x="72" y="490">「液体物」になる</text>

  <!-- 飛行機 -->
  <path d="M760 120 l90 20 l40 -30 h20 l-20 40 l60 14 l20 -14 h14 l-12 24 l12 24 h-14 l-20 -14 l-60 14 l20 40 h-20 l-40 -30 l-90 20z" fill="#9DB383" transform="rotate(-8 880 140)"/>

  <!-- スーツケース -->
  <g transform="translate(700 250)">
    <rect x="60" y="0" width="80" height="34" rx="12" fill="none" stroke="#173D38" stroke-width="10"/>
    <rect x="0" y="28" width="200" height="250" rx="24" fill="#5E7B49"/>
    <rect x="40" y="28" width="12" height="250" fill="#7C9A5E"/>
    <rect x="148" y="28" width="12" height="250" fill="#7C9A5E"/>
  </g>
  <text class="tag" x="800" y="560">預ける</text>

  <!-- 透明な袋と小さな容器 -->
  <g transform="translate(950 300)">
    <rect x="0" y="0" width="170" height="180" rx="12" fill="#FFFFFF" opacity=".85" stroke="#9DB383" stroke-width="3"/>
    <rect x="0" y="0" width="170" height="16" rx="6" fill="#C9D8B4"/>
    <rect x="22" y="70" width="40" height="80" rx="10" fill="#E9C9B8"/>
    <rect x="28" y="56" width="28" height="16" rx="4" fill="#173D38"/>
    <rect x="78" y="90" width="64" height="60" rx="10" fill="#C9D8B4"/>
    <rect x="86" y="78" width="48" height="14" rx="4" fill="#173D38"/>
  </g>
  <text class="tag" x="1035" y="520">100ml以下を袋に</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の商品や画面ではありません</text>
</svg>
