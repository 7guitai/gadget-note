<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：仕事や授業でAIを使う前に（チャットの吹き出し、チェックリスト、鍵） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 56px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 18px; font-weight: 700; fill: #5E7B49; text-anchor: middle; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">AI ／ 使う前の確認</text>
  <text class="h1" x="68" y="254">仕事や授業で</text>
  <text class="h1" x="68" y="330">AIを使う前に</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">入力する情報・所属先のルール・</text>
  <text class="sub" x="72" y="478">利用規約・出力の確認</text>

  <!-- チャットの吹き出し -->
  <g transform="translate(700 130)">
    <rect width="250" height="120" rx="20" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3"/>
    <path d="M40 118 l-8 30 l34 -30z" fill="#FFFFFF" stroke="#D8DDD3" stroke-width="3" stroke-linejoin="round"/>
    <rect x="38" y="114" width="32" height="8" fill="#FFFFFF"/>
    <rect x="28" y="32" width="190" height="14" rx="7" fill="#C9D8B4"/>
    <rect x="28" y="62" width="140" height="14" rx="7" fill="#C9D8B4"/>
    <rect x="178" y="58" width="44" height="22" rx="6" fill="#E9C9B8"/>
  </g>
  <text class="tag" x="825" y="310">入力する前に</text>

  <!-- チェックリスト -->
  <g transform="translate(980 170)">
    <rect width="150" height="200" rx="16" fill="#173D38"/>
    <g stroke="#9DB383" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 42 l10 10 l18 -20"/>
      <path d="M22 94 l10 10 l18 -20"/>
      <path d="M22 146 l10 10 l18 -20"/>
    </g>
    <rect x="66" y="38" width="62" height="10" rx="5" fill="#5E7B49"/>
    <rect x="66" y="90" width="62" height="10" rx="5" fill="#5E7B49"/>
    <rect x="66" y="142" width="62" height="10" rx="5" fill="#5E7B49"/>
  </g>
  <text class="tag" x="1055" y="400">ルールを確認</text>

  <!-- 鍵 -->
  <g transform="translate(790 360)">
    <path d="M20 50 v-18 a30 30 0 0 1 60 0 v18" fill="none" stroke="#5E7B49" stroke-width="12"/>
    <rect x="0" y="48" width="100" height="90" rx="14" fill="#5E7B49"/>
    <circle cx="50" cy="86" r="11" fill="#F6F2EA"/>
    <rect x="45" y="90" width="10" height="24" rx="4" fill="#F6F2EA"/>
  </g>
  <text class="tag" x="840" y="530">個人情報を守る</text>

  <text class="cap" x="640" y="604">※ イメージ。実際のサービスの画面ではありません</text>
</svg>
