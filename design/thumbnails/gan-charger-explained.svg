<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：充電器のGaN（窒化ガリウム）とは（大きな充電器と小さな充電器の比較） -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 72px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 20px; font-weight: 700; fill: #5E7B49; letter-spacing: .02em; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .body { fill: #FFFFFF; stroke: #C9D1C2; stroke-width: 3; }
      .port { fill: #E6EBE1; stroke: #9DB383; stroke-width: 2; }
      .prong { fill: #B9C2B3; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="330" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <!-- 左：文字 -->
  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">ガジェット ／ 充電器の基本</text>
  <text class="h1" x="68" y="268">充電器の</text>
  <text class="h1" x="68" y="356">GaNとは？</text>
  <rect x="72" y="398" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="458">小さくできる理由と</text>
  <text class="sub" x="72" y="500">選ぶときの注意</text>

  <!-- 右：大きな充電器（従来） -->
  <g transform="translate(700 190)">
    <rect class="prong" x="52" y="-36" width="14" height="40" rx="4"/>
    <rect class="prong" x="104" y="-36" width="14" height="40" rx="4"/>
    <rect class="body" width="170" height="230" rx="30"/>
    <rect class="port" x="55" y="160" width="60" height="22" rx="11"/>
    <rect x="40" y="40" width="90" height="10" rx="5" fill="#E6EBE1"/>
    <rect x="40" y="62" width="64" height="10" rx="5" fill="#E6EBE1"/>
  </g>

  <!-- 矢印 -->
  <path d="M905 310 h56" stroke="#7C9A5E" stroke-width="8" stroke-linecap="round"/>
  <path d="M950 290 l22 20 l-22 20" fill="none" stroke="#7C9A5E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右：小さな充電器（GaN） -->
  <g transform="translate(1000 250)">
    <rect class="prong" x="30" y="-28" width="11" height="30" rx="3"/>
    <rect class="prong" x="69" y="-28" width="11" height="30" rx="3"/>
    <rect width="110" height="130" rx="24" fill="#7C9A5E"/>
    <rect x="25" y="88" width="60" height="20" rx="10" fill="#E6EBE1"/>
    <!-- 稲妻 -->
    <path d="M60 22 l-18 34 h16 l-6 26 l22 -38 h-16 z" fill="#FFFFFF"/>
    <!-- きらめき -->
    <path d="M126 -36 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5z" fill="#C9D8B4"/>
  </g>

  <text class="tag" x="785" y="470" text-anchor="middle">従来</text>
  <text class="tag" x="1055" y="470" text-anchor="middle">GaN</text>

  <text class="cap" x="760" y="604">※ イメージ。実際の製品の形ではありません</text>
</svg>
