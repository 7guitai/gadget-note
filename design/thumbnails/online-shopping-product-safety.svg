<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：スマホの通販画面、マーク風の表示（実在のマークは描かない）、虫めがね -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .btn { font-size: 18px; font-weight: 800; fill: #FFFFFF; }
      .pr { font-size: 22px; font-weight: 800; fill: #173D38; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">GADGET ／ 解説</text>
  <text class="h1" x="68" y="252">ネット通販の家電</text>
  <text class="h1" x="68" y="326">買う前に確認</text>
  <rect x="72" y="376" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="436">4つのチェックとマークの見方</text>

  <!-- スマホ -->
  <rect x="760" y="110" width="210" height="380" rx="30" fill="#FFFFFF" stroke="#173D38" stroke-width="7"/>
  <rect x="790" y="150" width="150" height="120" rx="12" fill="#C9D8B4"/>
  <rect x="820" y="180" width="90" height="60" rx="10" fill="#7C9A5E"/>
  <rect x="790" y="285" width="120" height="12" rx="6" fill="#E6EBE1"/>
  <text class="pr" x="790" y="330">¥ ?</text>
  <rect x="790" y="410" width="150" height="44" rx="22" fill="#E8B04B"/>
  <text class="btn" x="865" y="439" text-anchor="middle">購入</text>
  <!-- マーク風（ひし形） -->
  <g transform="translate(1040 230)">
    <path d="M0 -50 L50 0 L0 50 L-50 0 Z" fill="#FFFFFF" stroke="#173D38" stroke-width="6"/>
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#C9D8B4"/>
    <rect x="-44" y="62" width="88" height="14" rx="7" fill="#5E7B49"/>
  </g>
  <!-- 虫めがね -->
  <g transform="translate(980 340)">
    <circle cx="40" cy="40" r="36" fill="#FFFFFF" fill-opacity=".7" stroke="#173D38" stroke-width="8"/>
    <path d="M66 66 L98 98" stroke="#173D38" stroke-width="13" stroke-linecap="round"/>
  </g>
  <text class="tag" x="900" y="530" text-anchor="middle">価格・販売元・事業者名・捨て方</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
