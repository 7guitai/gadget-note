<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- OCHA NOTE サムネ：電動工具の非純正バッテリー（電動ドライバー、バッテリー、充電器、注意マーク）。メーカーのロゴは描かない -->
  <defs>
    <style>
      text { font-family: Noto, sans-serif; fill: #173D38; }
      .pill { font-size: 17px; font-weight: 700; letter-spacing: .12em; fill: #FFFFFF; }
      .eye { font-size: 24px; font-weight: 600; fill: #5E7B49; letter-spacing: .04em; }
      .h1 { font-size: 52px; font-weight: 800; letter-spacing: -.02em; }
      .sub { font-size: 28px; font-weight: 600; fill: #3F5A50; }
      .tag { font-size: 17px; font-weight: 700; fill: #5E7B49; }
      .cap { font-size: 17px; font-weight: 600; fill: #52675F; }
      .ex { font-size: 44px; font-weight: 900; fill: #173D38; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#F6F2EA"/>
  <circle cx="900" cy="320" r="250" fill="#E6EBE1"/>
  <circle cx="1120" cy="70" r="70" fill="#ECEAE4"/>
  <circle cx="660" cy="560" r="44" fill="#ECEAE4"/>

  <rect x="72" y="64" width="156" height="38" rx="19" fill="#173D38"/>
  <text class="pill" x="150" y="89" text-anchor="middle">OCHA NOTE</text>
  <text class="eye" x="72" y="170">TOOLBOX ／ 解説</text>
  <text class="h1" x="68" y="252">電動工具の</text>
  <text class="h1" x="68" y="324">互換バッテリーは危ない？</text>
  <rect x="72" y="374" width="72" height="6" rx="3" fill="#9DB383"/>
  <text class="sub" x="72" y="434">充電中の発火と確認ポイント</text>

  <!-- 電動ドライバー -->
  <g transform="translate(720 170)">
    <rect x="0" y="0" width="190" height="70" rx="20" fill="#7C9A5E"/>
    <rect x="190" y="24" width="60" height="22" rx="6" fill="#173D38"/>
    <rect x="250" y="31" width="40" height="8" rx="3" fill="#3F5A50"/>
    <rect x="60" y="60" width="56" height="110" rx="14" fill="#5E7B49"/>
    <!-- バッテリー -->
    <rect x="34" y="166" width="108" height="56" rx="10" fill="#173D38"/>
    <rect x="50" y="182" width="76" height="10" rx="5" fill="#C9D8B4"/>
  </g>
  <!-- 充電器 -->
  <g transform="translate(920 360)">
    <rect width="150" height="56" rx="12" fill="#FFFFFF" stroke="#173D38" stroke-width="5"/>
    <circle cx="124" cy="28" r="8" fill="#E8B04B"/>
    <path d="M20 56 Q10 90 -30 96" fill="none" stroke="#173D38" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 注意マーク -->
  <g transform="translate(1030 210)">
    <path d="M0 -58 L54 40 L-54 40 Z" fill="#E8B04B" stroke="#173D38" stroke-width="5" stroke-linejoin="round"/>
    <text class="ex" x="0" y="30" text-anchor="middle">!</text>
  </g>
  <text class="tag" x="900" y="500" text-anchor="middle">事故の約8割は充電中</text>

  <text class="cap" x="640" y="604">※ イメージイラスト</text>
</svg>
